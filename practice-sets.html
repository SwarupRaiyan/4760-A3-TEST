<style>
:root{
  --navy:#1b2a4a; --navy-deep:#101a30; --teal:#0f7a72; --teal-light:#e6f4f2;
  --amber:#c9822a; --amber-light:#fbeedd; --rose:#b3454a; --rose-light:#fbe9ea;
  --ink:#1c2333; --ink-soft:#5b6478; --line:#e3e7ee; --paper:#ffffff; --bg:#f4f6fb;
  --radius:14px; --shadow:0 2px 10px rgba(20,30,60,0.06), 0 1px 2px rgba(20,30,60,0.08);
  --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; min-height:100vh;
}
.app{max-width:820px; margin:0 auto; padding:0 20px 80px;}
header.top{
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);
  color:#fff; padding:22px 24px; border-radius:0 0 20px 20px; margin-bottom:22px;
  box-shadow:var(--shadow);
}
header.top .crumb{font-size:12.5px; letter-spacing:.09em; text-transform:uppercase; opacity:.72; margin-bottom:4px;}
header.top .crumb a{color:#fff; text-decoration:none; opacity:.85;}
header.top .crumb a:hover{text-decoration:underline;}
header.top h1{margin:0; font-size:23px; font-weight:700; font-family:var(--serif); letter-spacing:.01em;}
header.top .sub{margin-top:3px; font-size:14px; opacity:.85;}

.card{background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:18px;}

/* home grid of sets */
.set-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:10px;}
.set-card{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; cursor:pointer; box-shadow:var(--shadow); transition:.15s; text-align:left;
}
.set-card:hover{transform:translateY(-2px); border-color:var(--rose);}
.set-card .num{font-family:var(--serif); font-size:20px; font-weight:700; color:var(--navy);}
.set-card .meta{font-size:12.5px; color:var(--ink-soft); margin:4px 0 12px;}
.bar-bg{background:#e9ecf3; border-radius:6px; height:6px; overflow:hidden;}
.bar-fill{background:linear-gradient(90deg,var(--rose),#d5686d); height:100%; border-radius:6px;}
.bar-lbl{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}

/* question nav dots */
.qnav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
.qdot{
  width:30px; height:30px; border-radius:8px; border:1.5px solid var(--line); background:#fff;
  font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:.12s;
}
.qdot:hover{border-color:var(--rose);}
.qdot.active{background:var(--navy); border-color:var(--navy); color:#fff;}
.qdot.done{border-color:var(--teal); color:var(--teal);}
.qdot.done.active{background:var(--navy); color:#fff;}

.qmeta{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:12px; text-transform:uppercase; letter-spacing:.04em;}
.qmeta .pill{background:var(--rose-light); color:var(--rose); padding:3px 10px; border-radius:999px; font-weight:700;}
.qmeta .marks{font-weight:600;}
.qtext{font-size:16.5px; line-height:1.7; margin-bottom:20px;}

.options{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
.opt{
  border:1.5px solid var(--line); border-radius:10px; padding:13px 16px; cursor:pointer;
  display:flex; align-items:flex-start; gap:12px; transition:.12s; background:#fff; font-size:15px;
}
.opt:hover{border-color:var(--navy); background:#f8f9fd;}
.opt .letter{font-weight:700; color:var(--ink-soft); min-width:18px;}
.opt.correct{border-color:var(--teal); background:var(--teal-light);}
.opt.incorrect{border-color:var(--rose); background:var(--rose-light);}
.opt.disabled{cursor:default;}

button.primary{
  background:var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:9px;
  font-weight:700; font-size:14px; cursor:pointer;
}
button.primary:hover{background:var(--navy-deep);}
button.ghost{
  background:#fff; color:var(--navy); border:1.5px solid var(--line); padding:10px 18px; border-radius:9px;
  font-weight:600; font-size:14px; cursor:pointer;
}
button.ghost:hover{border-color:var(--navy);}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px;}

.answer-box{
  background:var(--teal-light); border:1px solid #b7e0da; border-radius:12px; padding:16px 18px;
  margin-top:16px; font-size:15px; line-height:1.75;
}
.answer-box .lbl{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--teal); font-weight:800; margin-bottom:8px;}

.feedback{border-radius:12px; padding:16px 18px; margin-top:16px; font-size:14.5px; line-height:1.65;}
.feedback.good{background:var(--teal-light); border:1px solid #b7e0da;}
.feedback.bad{background:var(--rose-light); border:1px solid #edc4c6;}
.feedback .verdict{font-weight:800; font-size:15.5px; margin-bottom:6px;}
.feedback.good .verdict{color:var(--teal);}
.feedback.bad .verdict{color:var(--rose);}

.footer-controls{display:flex; justify-content:space-between; margin-top:26px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap; gap:10px;}
.small{font-size:12.5px; color:var(--ink-soft);}
@media (max-width:640px){
  .app{padding:0 12px 60px;}
  header.top{padding:18px;}
  .card{padding:16px;}
}
</style>
</head>

  {marks:7, prompt:`$U = \\{1,2,\\dots,12\\}$, $A = \\{2,4,6,8,10,12\\}$, $B = \\{3,6,9,12\\}$, $C = \\{1,2,3,4,6\\}$<br><br>(a) Express $\\{12\\}$ using set operations on $A$, $B$, $C$ with the minimum number of operations. (2 marks)<br>(b) Find $|(A\\cup B\\cup C)'|$ using the Inclusion–Exclusion principle. (5 marks)`,
    answer:`(a) $(A\\cap B) - C = \\{6,12\\} - \\{1,2,3,4,6\\} = \\{12\\}$ (2 operations)<br>(b) $|(A\\cup B\\cup C)'| = 3$`},
  {marks:1, prompt:`Let $f : A\\to B$ and $g : B\\to C$. Which is always true?`,

  {marks:10, prompt:`(a) Compute $\\varphi(150)$. Show your working. (3 marks)<br>(b) Use the Extended Euclidean Algorithm to find $x, y$ such that $120x + 75y = \\gcd(120,75)$. (7 marks)`,

  {marks:4, prompt:`A bookshelf has 7 spaces. A student has 4 different fiction books and 5 different non-fiction books. Write an expression (need not evaluate) for the number of ordered arrangements filling all 7 spaces, if at least 2 fiction and at least 3 non-fiction books must be included. Justify your answer.`,

  {marks:6, prompt:`Prove that for any integer $n$, if $n$ is odd then $n^2$ is odd.`,
    answer:`$n=2k+1 \\Rightarrow n^2 = 4k^2+4k+1 = 2(2k^2+2k)+1$, which is odd.`},
  {marks:7, prompt:`Prove, using Boolean algebra laws, that $\\neg(P \\Leftrightarrow Q)$ is logically equivalent to $P \\oplus Q$ (exclusive-or). State the law used on each line.`,
    answer:`$\\neg(P\\Leftrightarrow Q) \\equiv \\neg[(P\\Rightarrow Q)\\wedge(Q\\Rightarrow P)] \\equiv \\neg(P\\Rightarrow Q)\\vee\\neg(Q\\Rightarrow P) \\equiv (P\\wedge\\neg Q)\\vee(Q\\wedge\\neg P) \\equiv P\\oplus Q$ — De Morgan's Law, then Implication Law, matching the definition of XOR.`},
  {marks:10, prompt:`$D(x)$: $x$ is a device. $C(x)$: $x$ is charged. $W(x,y)$: $x$ is more powerful than $y$.<br><br>(a) The laptop is a device that is charged. (1 mark)<br>(b) If a device is not charged, it is not usable. (Use $U(x)$: $x$ is usable.) (3 marks)<br>(c) There exists a device more powerful than all other devices. (6 marks)`,
    answer:`(a) $D(\\text{laptop}) \\wedge C(\\text{laptop})$<br>(b) $\\forall x\\,(\\neg C(x) \\Rightarrow \\neg U(x))$<br>(c) $\\exists x\\,\\forall y\\,((D(y)\\wedge x\\ne y)\\Rightarrow W(x,y))$`},
  {marks:10, prompt:`$a_1 = 5$, $a_n = 3a_{n-1} - 4$ for $n \\ge 2$.<br><br>(a) Compute $a_2, a_3, a_4$. (1 mark)<br>(b) State a closed-form expression for $a_n$. (1 mark)<br>(c) Prove it by induction. (8 marks)`,
    answer:`(a) $a_2=11,\\ a_3=29,\\ a_4=83$<br>(b) $a_n = 3^n+2$<br>(c) Base case $n=1$: $3^1+2=5=a_1$. ✓ Inductive step: assume $a_k=3^k+2$; then $a_{k+1}=3a_k-4=3(3^k+2)-4=3^{k+1}+2$. ✓`},
  {marks:7, prompt:`A stadium's ticket sales grow arithmetically: 12 tickets sold on day 1, increasing by 7 each day.<br><br>(a) Write $f_n$, tickets sold on day $n$. (2 marks)<br>(b) Write $T(n)$, total tickets sold after $n$ days. (4 marks)<br>(c) State the Big-O complexity of $T(n)$. (1 mark)`,
    answer:`(a) $f_n = 7n+5$<br>(b) $T(n) = 12n + \\dfrac{7n(n-1)}{2}$<br>(c) $O(n^2)$`},
  {marks:10, prompt:`(a) Compute $\\varphi(144)$. Show your working. (3 marks)<br>(b) Use the Extended Euclidean Algorithm to find $x, y$ such that $41x + 17y = \\gcd(41,17)$. Then state whether 17 has a multiplicative inverse mod 41, and if so, what it is. (7 marks)`,
    answer:`(a) $\\varphi(144) = 48$<br>(b) $\\gcd(41,17)=1$, with $x=5,\\ y=-12$ → since $\\gcd=1$, an inverse exists: $17^{-1} \\equiv 5 \\pmod{41}$`},
  {marks:4, prompt:`From 11 finalists, a first-place, second-place, and third-place prize will be awarded (all different people). Write an expression for the number of possible outcomes and justify it.`,
    answer:`$11 \\times 10 \\times 9 = 990$`},
  {marks:9, prompt:`15% of a population carries a particular gene. A test correctly detects the gene 85% of the time in carriers, and gives a false positive 10% of the time in non-carriers. Let $G$ = carrier, $T$ = tests positive.<br><br>(a) Find $\\Pr(T)$. (3 marks)<br>(b) Find $\\Pr(G\\mid T)$, simplified as a fraction. (6 marks)`,
    answer:`(a) $\\Pr(T) = 17/80 = 0.2125$<br>(b) $\\Pr(G\\mid T) = 3/5$`}
],
[ // SET 5
  {marks:7, prompt:`$U = \\{1,\\dots,12\\}$, $A = \\{1,2,3,4,6,12\\}$, $B = \\{2,4,6,8,10,12\\}$, $C = \\{3,6,9,12\\}$<br><br>(a) Express $\\{2,4,6,12\\}$ using set operations on $A$, $B$, $C$ using the minimum number of operations. (2 marks)<br>(b) Find $|(A\\cup B\\cup C)'|$ using Inclusion–Exclusion. (5 marks)`,
    answer:`(a) $A\\cap B = \\{2,4,6,12\\}$ directly — just 1 operation<br>(b) $|(A\\cup B\\cup C)'| = 3$`},
  {marks:1, prompt:`Let $f : A\\to B$, $g : B\\to C$. Which is always true?`,
    mcq:{options:[
      'If $f$ is not injective, then $g\\circ f$ is not injective.',
      'If $g$ is not injective, then $g\\circ f$ is not injective.',
      'If $f$ is injective, then $g\\circ f$ is injective regardless of $g$.',
      'If $g\\circ f$ is not injective, then $g$ is not injective.'
    ], correct:0, why:'This is the contrapositive of "$g\\circ f$ injective $\\Rightarrow f$ injective": if $f$ is not injective, $g\\circ f$ cannot be either.'}},
  {marks:2, prompt:`$A = \\{1,2,3,4,5\\}$. $R = \\{(a,b): a,b\\in A,\\ a+b \\text{ is even}\\}$. Determine which properties hold: reflexive, symmetric, transitive.`,
    answer:`Reflexive, symmetric, transitive — $R$ is an equivalence relation ("$a+b$ even" means $a,b$ share parity).`},
  {marks:6, prompt:`Prove that for any integers $a$ and $b$, if $a$ and $b$ are both even, then $a+b$ is even AND $a\\cdot b$ is even.`,
    answer:`$a=2k,\\ b=2j \\Rightarrow a+b=2(k+j)$ is even; $a\\cdot b=4kj$ is even.`},
  {marks:7, prompt:`Prove, using Boolean algebra laws, that $P \\Rightarrow (Q\\vee R)$ is logically equivalent to $(P\\wedge\\neg Q) \\Rightarrow R$. State the law used on each line.`,
    answer:`$P\\Rightarrow(Q\\vee R) \\equiv \\neg P\\vee Q\\vee R \\equiv (\\neg P\\vee Q)\\vee R \\equiv \\neg(P\\wedge\\neg Q)\\vee R \\equiv (P\\wedge\\neg Q)\\Rightarrow R$ — Implication Law, regrouping, De Morgan's Law, Implication Law.`},
  {marks:10, prompt:`$C(x)$: $x$ is a course. $P(x)$: $x$ has a prerequisite. $E(x,y)$: $x$ requires $y$ as a prerequisite.<br><br>(a) MCD4760 has a prerequisite. (1 mark)<br>(b) Some courses have no prerequisite. (3 marks)<br>(c) There exists a course that is a prerequisite for every other course. (6 marks)`,
    answer:`(a) $\\exists y\\, E(\\text{MCD4760}, y)$<br>(b) $\\exists x\\, \\neg P(x)$<br>(c) $\\exists x\\,\\forall y\\,((C(y)\\wedge x\\ne y)\\Rightarrow E(y,x))$`},
  {marks:10, prompt:`$a_1 = 1$, $a_n = 2a_{n-1} + 5$ for $n \\ge 2$.<br><br>(a) Compute $a_2, a_3, a_4$. (1 mark)<br>(b) State a closed-form expression for $a_n$. (1 mark)<br>(c) Prove it by induction. (8 marks)`,
    answer:`(a) $a_2=7,\\ a_3=19,\\ a_4=43$<br>(b) $a_n = 3\\cdot 2^n - 5$<br>(c) Base case $n=1$: $3\\cdot 2 - 5 = 1 = a_1$. ✓ Inductive step: assume $a_k=3\\cdot 2^k-5$; then $a_{k+1}=2a_k+5=2(3\\cdot 2^k-5)+5=3\\cdot 2^{k+1}-5$. ✓`},
  {marks:7, prompt:`A runner's training distance increases arithmetically: 3 km in week 1, increasing by 2 km each week.<br><br>(a) Write $f_n$, distance in week $n$. (2 marks)<br>(b) Write $T(n)$, total distance after $n$ weeks. (4 marks)<br>(c) State the Big-O complexity of $T(n)$. (1 mark)`,
    answer:`(a) $f_n = 2n+1$<br>(b) $T(n) = 3n + \\dfrac{2n(n-1)}{2}$<br>(c) $O(n^2)$`},
  {marks:10, prompt:`(a) Compute $\\varphi(168)$. Show your working. (3 marks)<br>(b) Use the Extended Euclidean Algorithm to find $x, y$ such that $52x + 35y = \\gcd(52,35)$. Then state whether 35 has a multiplicative inverse mod 52, and if so, what it is. (7 marks)`,
    answer:`(a) $\\varphi(168) = 48$<br>(b) $\\gcd(52,35)=1$, with $x=-2,\\ y=3$ → since $\\gcd=1$, an inverse exists: $35^{-1} \\equiv 3 \\pmod{52}$`},
  {marks:4, prompt:`A shelf has 6 spaces. A collector has 3 different sci-fi novels and 4 different fantasy novels. Write an expression (need not evaluate) for the number of ordered arrangements filling all 6 spaces, if at least 1 sci-fi and at least 2 fantasy novels must be included. Justify your answer.`,
    answer:`Valid (sci-fi, fantasy) counts are $(2,4)$ and $(3,3)$. Expression: $6!\\times\\big[\\binom{3}{2}\\binom{4}{4} + \\binom{3}{3}\\binom{4}{3}\\big] = 6!\\times(3+4)$`},
  {marks:9, prompt:`A randomly chosen part has a 60% chance of needing recalibration (event $D$). A diagnostic test correctly detects recalibration need 95% of the time when needed, and gives a false alarm 25% of the time when not needed. Let $D$ = needs recalibration, $T$ = test positive.<br><br>(a) Find $\\Pr(T)$. (3 marks)<br>(b) Find $\\Pr(D\\mid T)$, simplified as a fraction. (6 marks)`,
    answer:`(a) $\\Pr(T) = 67/100 = 0.67$<br>(b) $\\Pr(D\\mid T) = 57/67$`}
],
[ // SET 6
  {marks:7, prompt:`$U = \\{1,\\dots,16\\}$, $A = \\{1,2,3,4,5,6,7,8\\}$, $B = \\{5,6,7,8,9,10\\}$, $C = \\{2,4,6,8,10,12,14,16\\}$<br><br>(a) Express $\\{6,8\\}$ using set operations on $A$, $B$, $C$ using the minimum number of operations. (2 marks)<br>(b) Find $|(A\\cup B\\cup C)'|$ using Inclusion–Exclusion. (5 marks)`,
    answer:`(a) $(A\\cap B) \\cap C = \\{5,6,7,8\\} \\cap \\{2,4,6,8,10,12,14,16\\} = \\{6,8\\}$ (2 operations)<br>(b) $|(A\\cup B\\cup C)'| = 3$`},
  {marks:1, prompt:`Let $f : A\\to B$, $g : B\\to C$. Which is always true?`,
    mcq:{options:[
      'If $g\\circ f$ is surjective, then $f$ is surjective.',
      'If $g\\circ f$ is surjective, then $g$ is surjective.',
      'If $f$ and $g$ are both injective, then $g\\circ f$ is surjective.',
      'If $g\\circ f$ is bijective, then $g$ is injective.'
    ], correct:1, why:'$g\\circ f$ surjective always forces $g$ to be surjective — the same result as before.'}},
  {marks:2, prompt:`$A = \\{1,\\dots,6\\}$. $R = \\{(a,b): a,b\\in A,\\ a \\text{ divides } b\\}$. Determine which properties hold: reflexive, symmetric, transitive.`,
    answer:`Reflexive: yes ($a\\mid a$). Symmetric: <strong>no</strong> ($2\\mid 4$ but $4\\nmid 2$). Transitive: yes (divisibility chains).`},
  {marks:6, prompt:`Prove that for any integer $n \\ge 1$, $n^2 \\ge n$ (i.e., $n^2 - n \\ge 0$).`,
    answer:`$n^2-n = n(n-1) \\ge 0$ for all $n\\ge 1$, since both factors are non-negative.`},
  {marks:7, prompt:`Prove, using Boolean algebra laws, that $(P\\wedge Q) \\vee (\\neg P \\wedge R)$ is logically equivalent to $(P\\vee R) \\wedge (\\neg P\\vee Q)$. State the law used on each line.`,
    answer:`Expand the RHS $(P\\vee R)\\wedge(\\neg P\\vee Q)$ via the Distributive Law: $= (P\\wedge\\neg P)\\vee(P\\wedge Q)\\vee(R\\wedge\\neg P)\\vee(R\\wedge Q) = (P\\wedge Q)\\vee(\\neg P\\wedge R)\\vee(Q\\wedge R)$ since $P\\wedge\\neg P$ is false and drops out. The leftover $(Q\\wedge R)$ term is redundant (Consensus Law) — whenever it's true, either $P\\wedge Q$ or $\\neg P\\wedge R$ already is — so it's absorbed, leaving exactly $(P\\wedge Q)\\vee(\\neg P\\wedge R)$, matching the LHS.`},
  {marks:10, prompt:`$V(x)$: $x$ is a vehicle. $E(x)$: $x$ is electric. $F(x,y)$: $x$ is faster than $y$.<br><br>(a) The Tesla is an electric vehicle. (1 mark)<br>(b) Not all vehicles are electric. (3 marks)<br>(c) There exists a vehicle that is faster than every other electric vehicle. (6 marks)`,
    answer:`(a) $V(\\text{Tesla}) \\wedge E(\\text{Tesla})$<br>(b) $\\exists x\\,(V(x)\\wedge \\neg E(x))$<br>(c) $\\exists x\\,\\forall y\\,((V(y)\\wedge E(y)\\wedge x\\ne y)\\Rightarrow F(x,y))$`},
  {marks:10, prompt:`$a_1 = 6$, $a_n = 4a_{n-1} - 6$ for $n \\ge 2$.<br><br>(a) Compute $a_2, a_3, a_4$. (1 mark)<br>(b) State a closed-form expression for $a_n$. (1 mark)<br>(c) Prove it by induction. (8 marks)`,
    answer:`(a) $a_2=18,\\ a_3=66,\\ a_4=258$<br>(b) $a_n = 4^n+2$<br>(c) Base case $n=1$: $4^1+2=6=a_1$. ✓ Inductive step: assume $a_k=4^k+2$; then $a_{k+1}=4a_k-6=4(4^k+2)-6=4^{k+1}+2$. ✓`},
  {marks:7, prompt:`A social media post's shares increase arithmetically: 10 shares in hour 1, increasing by 8 each hour.<br><br>(a) Write $f_n$, shares in hour $n$. (2 marks)<br>(b) Write $T(n)$, total shares after $n$ hours. (4 marks)<br>(c) State the Big-O complexity of $T(n)$. (1 mark)`,
    answer:`(a) $f_n = 8n+2$<br>(b) $T(n) = 10n + \\dfrac{8n(n-1)}{2}$<br>(c) $O(n^2)$`},
  {marks:10, prompt:`(a) Compute $\\varphi(56)$. Show your working. (3 marks)<br>(b) Use the Extended Euclidean Algorithm to find $x, y$ such that $90x + 63y = \\gcd(90,63)$. (7 marks)`,
    answer:`(a) $\\varphi(56) = 24$<br>(b) $\\gcd(90,63)=9$, with $x=-2,\\ y=3$ (check: $90(-2)+63(3)=9$)`},
  {marks:4, prompt:`13 sprinters compete in a race. Gold, silver, and bronze medals are awarded to 3 different sprinters. Write an expression for the number of possible medal outcomes and justify it.`,
    answer:`$13 \\times 12 \\times 11 = 1716$`},
  {marks:9, prompt:`2% of a batch of components are faulty. An inspection test correctly identifies 98% of faulty components as faulty, but also incorrectly flags 4% of good components as faulty. Let $F$ = faulty, $T$ = flagged.<br><br>(a) Find $\\Pr(T)$. (3 marks)<br>(b) Find $\\Pr(F\\mid T)$, simplified as a fraction. (6 marks)`,
    answer:`(a) $\\Pr(T) = 147/2500 = 0.0588$<br>(b) $\\Pr(F\\mid T) = 1/3$`}
]
];

function loadProgress(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return SETS.map(s=>s.map(()=>false));
}
function saveProgress(p){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){}
}

let progress = loadProgress();
let view = { set:null, q:0 };

function typeset(){
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise().catch(()=>{});
  }
}

function renderHome(){
  const rows = SETS.map((qs,i)=>{
    const done = progress[i].filter(Boolean).length;
    const pct = Math.round(done/qs.length*100);
    return `<button class="set-card" onclick="openSet(${i})">
      <div class="num">Set ${i+1}</div>
      <div class="meta">11 questions · full topic spread</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-lbl">${done}/${qs.length} reviewed</div>
    </button>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="crumb"><a href="index.html">← Test 3 Study Hub</a></div>
      <h1>6 New Practice Sets</h1>
      <div class="sub">Six full mock-test style sets — Sets, Functions, Relations, Proof, Boolean Algebra, Predicate Logic, Recurrence &amp; Induction, Series, Number Theory, Counting, Probability.</div>
    </header>
    <div class="set-grid">${rows}</div>
    <div class="small" style="text-align:center; margin-top:6px;">Work through each question, then reveal the answer to self-check. Progress is saved on this device.</div>
  `;
}

function openSet(i){
  view.set = i; view.q = 0;
  renderQuestion();
}

function backHome(){
  view.set = null;
  renderHome();
}

function renderQuestion(){
  const qs = SETS[view.set];
  const q = qs[view.q];
  const topic = TOPICS[view.q];
  const dots = qs.map((qq,i)=>{
    let cls = 'qdot';
    if(progress[view.set][i]) cls += ' done';
    if(i===view.q) cls += ' active';
    return `<div class="${cls}" onclick="jumpTo(${i})">${i+1}</div>`;
  }).join('');

  let bodyHtml = '';
  if(q.mcq){
    const opts = q.mcq.options.map((t,i)=>`<div class="opt" data-idx="${i}" onclick="selectOpt(${i})"><span class="letter">${String.fromCharCode(97+i)}.</span><span>${t}</span></div>`).join('');
    bodyHtml = `<div class="options" id="optWrap">${opts}</div><div id="fbWrap"></div>`;
  } else {
    const alreadyDone = progress[view.set][view.q];
    bodyHtml = `
      <div class="btnrow">
        <button class="primary" id="revealBtn" onclick="revealAnswer()">${alreadyDone? 'Show answer again' : 'Reveal answer'}</button>
      </div>
      <div id="answerWrap">${alreadyDone? answerBoxHtml(q) : ''}</div>
    `;
  }

  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="crumb"><a href="javascript:void(0)" onclick="backHome()">← All 6 sets</a></div>
      <h1>Set ${view.set+1} · Practice Questions</h1>
      <div class="sub">Question ${view.q+1} of ${qs.length}</div>
    </header>
    <div class="qnav">${dots}</div>
    <div class="card">
      <div class="qmeta"><span class="pill">${topic}</span><span class="marks">${q.marks} mark${q.marks>1?'s':''}</span></div>
      <div class="qtext">${q.prompt}</div>
      ${bodyHtml}
      <div class="footer-controls">
        <button class="ghost" onclick="prevQ()" ${view.q===0?'disabled':''}>← Previous</button>
        <button class="ghost" onclick="nextQ()" ${view.q===qs.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  `;
  typeset();
}

function answerBoxHtml(q){
  return `<div class="answer-box"><div class="lbl">Answer</div>${q.answer}</div>`;
}

function revealAnswer(){
  const q = SETS[view.set][view.q];
  document.getElementById('answerWrap').innerHTML = answerBoxHtml(q);
  progress[view.set][view.q] = true;
  saveProgress(progress);
  document.getElementById('revealBtn').textContent = 'Show answer again';
  refreshDots();
  typeset();
}

function selectOpt(idx){
  const q = SETS[view.set][view.q];
  const wrap = document.getElementById('optWrap');
  const opts = wrap.querySelectorAll('.opt');
  opts.forEach((el,i)=>{
    el.classList.add('disabled');
    el.onclick = null;
    if(i===q.mcq.correct) el.classList.add('correct');
    else if(i===idx) el.classList.add('incorrect');
  });
  const isCorrect = idx===q.mcq.correct;
  document.getElementById('fbWrap').innerHTML = `
    <div class="feedback ${isCorrect?'good':'bad'}">
      <div class="verdict">${isCorrect? '✓ Correct' : '✕ Not quite'}</div>
      ${q.mcq.why}
    </div>`;
  progress[view.set][view.q] = true;
  saveProgress(progress);
  refreshDots();
  typeset();
}

function refreshDots(){
  const qs = SETS[view.set];
  const nav = document.querySelector('.qnav');
  if(!nav) return;
  nav.innerHTML = qs.map((qq,i)=>{
    let cls = 'qdot';
    if(progress[view.set][i]) cls += ' done';
    if(i===view.q) cls += ' active';
    return `<div class="${cls}" onclick="jumpTo(${i})">${i+1}</div>`;
  }).join('');
}

function jumpTo(i){ view.q = i; renderQuestion(); }
function prevQ(){ if(view.q>0){ view.q--; renderQuestion(); } }
function nextQ(){ if(view.q<SETS[view.set].length-1){ view.q++; renderQuestion(); } }

renderHome();
typeset();
</script>
</body>
</html>
