de via the Distributive Law:<br><br>(P∨R) ∧ (¬P∨Q) = (P∧¬P) ∨ (P∧Q) ∨ (R∧¬P) ∨ (R∧Q)<br><br>Since P∧¬P is always False, that term drops out:<br><br>= (P∧Q) ∨ (¬P∧R) ∨ (Q∧R)<br><br><strong><em>Consensus Law</em></strong><br><br>The leftover term (Q∧R) is redundant: whenever Q∧R is true, either P is<br>true (making P∧Q true, since Q is true) or P is false (making ¬P∧R true,<br>since R is true). So Q∧R never adds a case not already covered.<br><br>(P∧Q) ∨ (¬P∧R) ∨ (Q∧R) ≡ (P∧Q) ∨ (¬P∧R)<br><br>This matches the left-hand side exactly.", "answer": "<strong>(P∧Q)∨(¬P∧R) ≡ (P∨R)∧(¬P∨Q) ∎</strong>", "how_to_enter": "Chain of equivalences with named laws<br>(Distributive Law, Consensus Law).", "typing": "(P AND Q) OR (NOT P AND R) <=> (P OR R) AND (NOT P OR Q)"}, {"num": "6", "marks": "10 marks", "topic": "Predicate Logic", "problem": "V(x): x is a vehicle. E(x): x is electric. F(x,y): x is faster than y.<br><br>(a) The Tesla is an electric vehicle. (b) Not all vehicles are<br>electric. (c) There exists a vehicle faster than every other electric<br>vehicle.", "solution": "<strong><em>(a)</em></strong><br><br>V(Tesla) ∧ E(Tesla)<br><br><strong><em>(b)</em></strong><br><br>∃x ( V(x) ∧ ¬E(x) )<br><br><strong><em>(c)</em></strong><br><br>∃x ∀y ( (V(y) ∧ E(y) ∧ x≠y) ⇒ F(x,y) )", "answer": "<strong>(a) V(Tesla)∧E(Tesla) (b) ∃x(V(x)∧¬E(x)) (c)<br>∃x∀y((V(y)∧E(y)∧x≠y)⇒F(x,y))</strong>", "how_to_enter": "Formal predicate-logic expressions.", "typing": "(a) V(Tesla) AND E(Tesla) (b) EXISTS x(V(x) AND NOT E(x)) (c) EXISTS x FORALL y((V(y) AND E(y) AND x!=y)=>F(x,y))"}, {"num": "7", "marks": "10 marks", "topic": "Recurrence & Induction", "problem": "a₁=6, aₙ=4aₙ₋₁−6 for n≥2. (a) Compute a₂,a₃,a₄. (b) Closed form. (c)<br>Prove by induction.", "solution": "<strong><em>(a)</em></strong><br><br>a₂ = 4(6)−6 = 18<br><br>a₃ = 4(18)−6 = 66<br><br>a₄ = 4(66)−6 = 258<br><br><strong><em>(b)</em></strong><br><br>6,18,66,258 matches 4¹+2, 4²+2, 4³+2, 4⁴+2:<br><br>aₙ = 4ⁿ + 2<br><br><strong><em>Base Case</em></strong><br><br>4¹+2 = 6 = a₁ ✓<br><br><strong><em>Inductive Hypothesis</em></strong><br><br>Assume aₖ = 4ᵏ + 2.<br><br><strong><em>Inductive Step</em></strong><br><br>aₖ₊₁ = 4aₖ − 6 = 4(4ᵏ+2) − 6 = 4ᵏ⁺¹ + 8 − 6 = 4ᵏ⁺¹ + 2<br><br>Matches the target form. By induction, aₙ = 4ⁿ+2 for all n≥1.", "answer": "<strong>a₂=18, a₃=66, a₄=258. aₙ = 4ⁿ + 2 (proved by induction) ∎</strong>", "how_to_enter": "Three integers; a formula; full induction<br>proof.", "typing": "a_2=18, a_3=66, a_4=258. a_n = 4^n + 2 (proved by induction)"}, {"num": "8", "marks": "7 marks", "topic": "Series", "problem": "Social media shares: 10 in hour 1, +8 each hour. (a) fₙ. (b) T(n). (c)<br>Big-O.", "solution": "<strong><em>(a)</em></strong><br><br>fₙ = 10 + 8(n−1) = 8n + 2<br><br><strong><em>(b)</em></strong><br><br>T(n) = n(10) + \\[n(n−1)/2\\](8) = 10n + 4n(n−1)<br><br><strong><em>(c)</em></strong><br><br>Quadratic growth:", "answer": "<strong>fₙ = 8n + 2 T(n) = 10n + 4n(n−1) T(n) = O(n²)</strong>", "how_to_enter": "Algebraic expressions; Big-O notation.", "typing": "f_n = 8n + 2 T(n) = 10n + 4n(n-1) T(n) = O(n^2)"}, {"num": "9", "marks": "10 marks", "topic": "Number Theory", "problem": "(a) Compute φ(56). (b) EEA for 90x + 63y = gcd(90,63).", "solution": "<strong><em>(a)</em></strong><br><br>56 = 2³ × 7<br><br>φ(56) = 56 × 1/2 × 6/7 = 56 × 3/7 = 24<br><br><strong><em>(b) Euclidean Algorithm</em></strong><br><br>90 = 1(63) + 27<br><br>63 = 2(27) + 9<br><br>27 = 3(9) + 0<br><br>gcd(90,63) = 9.<br><br><strong><em>Back-substitution</em></strong><br><br>9 = 63 − 2(27)<br><br>9 = 63 − 2(90−63) = 3(63) − 2(90)<br><br>x = −2, y = 3. Check: 90(−2) + 63(3) = −180 + 189 = 9. ✓", "answer": "<strong>φ(56) = 24 x = −2, y = 3</strong>", "how_to_enter": "Single integer; pair of integers.", "typing": "phi(56) = 24 x = -2, y = 3"}, {"num": "10", "marks": "4 marks", "topic": "Counting", "problem": "13 sprinters compete for gold, silver, and bronze (3 distinct medals to<br>3 different sprinters). Write an expression.", "solution": "Ordered selection of 3 from 13 (order matters, no repeats):<br><br>13 × 12 × 11 = 1716", "answer": "<strong>13 × 12 × 11 = 1716 possible outcomes</strong>", "how_to_enter": "A single integer.", "typing": "13 * 12 * 11 = 1716 possible outcomes"}, {"num": "11", "marks": "9 marks", "topic": "Probability", "problem": "2% of components are faulty. A test correctly identifies 98% of faulty<br>components, and incorrectly flags 4% of good components. Find Pr(T) and<br>Pr(F|T).", "solution": "<strong><em>(a)</em></strong><br><br>Pr(T) = (0.98)(0.02) + (0.04)(0.98) = 0.0196 + 0.0392 = 0.0588<br><br>As a fraction: 147/2500.<br><br><strong><em>(b)</em></strong><br><br>Pr(F|T) = 0.0196 / 0.0588 = 196/588 = 1/3", "answer": "<strong>Pr(T) = 147/2500 = 0.0588 Pr(F|T) = 1/3</strong>", "how_to_enter": "Decimal or fraction for (a); simplified<br>fraction for (b).", "typing": "Pr(T) = 147/2500 = 0.0588 Pr(F|T) = 1/3"}]}};
const SET_ORDER = ["Set A", "Set B", "Set 1", "Set 2", "Set 3", "Set 4", "Set 5", "Set 6"];
const LS_KEY = 'mcd4760_guidebook_v1';

function loadProgress(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  const p = {};
  SET_ORDER.forEach(k => p[k] = SETS[k].questions.map(()=>false));
  return p;
}
function saveProgress(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();
let view = { set:null, q:0 };

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderHome(){
  const rows = SET_ORDER.map(key=>{
    const s = SETS[key];
    const done = progress[key].filter(Boolean).length;
    const pct = Math.round(done/s.questions.length*100);
    return `<button class="set-card" onclick="openSet('${key}')">
      <div class="num">${s.label}</div>
      <div class="meta">${s.questions.length} questions</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-lbl">${done}/${s.questions.length} reviewed</div>
    </button>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="crumb"><a href="index.html">&larr; Test 3 Study Hub</a></div>
      <h1>MCD4760 &mdash; Question &amp; Solution Guidebook</h1>
      <div class="sub">The full guidebook &mdash; 8 complete question sets, 90 questions, step-by-step solutions, and a Safe-Exam-Browser typing guide for every answer.</div>
    </header>
    <div class="set-grid">${rows}</div>
    <div class="small" style="text-align:center; margin-top:6px;">Work through each set, reveal the worked solution and final answer, then check the dashed box for exactly how to type the answer into a plain text box. Progress is saved on this device.</div>
  `;
}

function openSet(key){ view.set = key; view.q = 0; renderQuestion(); }
function backHome(){ view.set = null; renderHome(); }

function dotsHtml(){
  const qs = SETS[view.set].questions;
  return qs.map((qq,i)=>{
    let cls = 'qdot';
    if(progress[view.set][i]) cls += ' done';
    if(i===view.q) cls += ' active';
    return '<div class="'+cls+'" onclick="jumpTo('+i+')">'+(i+1)+'</div>';
  }).join('');
}

function renderQuestion(){
  const s = SETS[view.set];
  const q = s.questions[view.q];
  const already = progress[view.set][view.q];
  const marksLabel = q.marks ? q.marks : '';
  const topicLabel = q.topic || ('Question ' + q.num);

  document.getElementById('app').innerHTML = `
    <header class="top">
      <div class="crumb"><a href="javascript:void(0)" onclick="backHome()">&larr; All sets</a></div>
      <h1>${s.label}</h1>
      <div class="sub">Question ${view.q+1} of ${s.questions.length}</div>
    </header>
    <div class="qnav">${dotsHtml()}</div>
    <div class="card">
      <div class="qmeta"><span class="pill">${topicLabel}</span><span class="marks">${marksLabel}</span></div>
      <div class="qtext">${q.problem}</div>

      <div class="btnrow">
        <button class="primary" id="revealBtn" onclick="reveal()">${already ? 'Show solution again' : 'Reveal solution &amp; answer'}</button>
      </div>
      <div id="revealWrap">${already ? revealHtml(q) : ''}</div>

      <div class="footer-controls">
        <button class="ghost" onclick="prevQ()" ${view.q===0?'disabled':''}>&larr; Previous</button>
        <button class="ghost" onclick="nextQ()" ${view.q===s.questions.length-1?'disabled':''}>Next &rarr;</button>
      </div>
    </div>
  `;
}

function revealHtml(q){
  let html = '';
  if(q.solution){
    html += '<div class="section-head">Worked Solution</div><div class="solution-box">'+q.solution+'</div>';
  }
  html += '<div class="section-head">Final Answer</div><div class="answer-box">'+q.answer+'</div>';
  if(q.how_to_enter){
    html += '<div class="enter-note">Answer format: '+q.how_to_enter+'</div>';
  }
  html += '<div class="type-box"><div class="lbl">How to type this in Safe Exam Browser</div>'+escapeHtml(q.typing)+'</div>';
  return html;
}

function reveal(){
  const s = SETS[view.set];
  const q = s.questions[view.q];
  document.getElementById('revealWrap').innerHTML = revealHtml(q);
  progress[view.set][view.q] = true;
  saveProgress(progress);
  document.getElementById('revealBtn').innerHTML = 'Show solution again';
  const nav = document.querySelector('.qnav');
  if(nav) nav.innerHTML = dotsHtml();
}

function jumpTo(i){ view.q = i; renderQuestion(); }
function prevQ(){ if(view.q>0){ view.q--; renderQuestion(); } }
function nextQ(){ const s = SETS[view.set]; if(view.q<s.questions.length-1){ view.q++; renderQuestion(); } }

renderHome();
</script>
</body>
</html>
