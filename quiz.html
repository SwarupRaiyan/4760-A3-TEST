    case 'test-active': body.innerHTML = questionShellHTML(); renderQuestion(); break;
    case 'test-summary': body.innerHTML = testSummaryHTML(); attachTestSummaryEvents(); break;
  }
  typeset();
}

function headerHTML(){
  return `<header class="top">
    <div class="crumb">MCD4760 · Foundations of Computing</div>
    <h1>Test 3 Mastery Practice</h1>
    <div class="sub">Weeks 1–8 · Sets, Functions, Proofs, Logic, Predicates, Sequences, Number Theory, Counting</div>
  </header>`;
}
function navHTML(){
  const tabs = [['dashboard','Dashboard'],['weeks','By Week'],['mistakes','Mistake Review']];
  return `<nav class="tabs">${tabs.map(([m,l])=>`<button data-mode="${m}" class="${VIEW.mode===m?'active':''}">${l}</button>`).join('')}
    <button data-mode="test-setup" class="${VIEW.mode.startsWith('test')?'active':''}">Test Mode</button>
  </nav>`;
}

function bindNav(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.addEventListener('click', ()=>{ VIEW.mode = b.dataset.mode; VIEW.queue=[]; VIEW.qIndex=0; render(); });
  });
}

/* ---------------- DASHBOARD ---------------- */
function dashboardHTML(){
  const s = overallStats();
  const weak = weakestConcepts(3);
  const strong = strongestConcepts(3);
  return `
  <div class="grid-stats">
    <div class="stat"><div class="num">${s.overallMastery}%</div><div class="lbl">Overall Mastery</div></div>
    <div class="stat"><div class="num">${s.attempted}</div><div class="lbl">Questions Attempted</div></div>
    <div class="stat"><div class="num">${s.accuracy}%</div><div class="lbl">Accuracy</div></div>
    <div class="stat"><div class="num">${s.streak}</div><div class="lbl">Current Streak</div></div>
  </div>
  <div class="actions-grid">
    <button class="action-btn" id="btn-continue"><span class="icon">▶</span><div class="title">Continue Practice</div><div class="desc">Smart, adaptive question selection across all weeks</div></button>
    <button class="action-btn" id="btn-mistakes"><span class="icon">✕</span><div class="title">Practice Mistakes</div><div class="desc">Revisit questions you've gotten wrong</div></button>
    <button class="action-btn" id="btn-weak"><span class="icon">◐</span><div class="title">Practice Weak Concepts</div><div class="desc">Targeted drills on your lowest-mastery templates</div></button>
    <button class="action-btn" id="btn-original"><span class="icon">▤</span><div class="title">Original Quiz Questions</div><div class="desc">The exact Weeks 1–8 questions, unmodified</div></button>
    <button class="action-btn" id="btn-variant"><span class="icon">⟲</span><div class="title">Practice Variants</div><div class="desc">Fresh, computer-generated versions of every question</div></button>
    <button class="action-btn" id="btn-test"><span class="icon">⏱</span><div class="title">Test Mode</div><div class="desc">Timed, no hints, simulated Test 3 conditions</div></button>
  </div>
  ${weak.length? `<h2 class="section">Weakest Concepts</h2><div class="concept-tags">${weak.map(q=>`<span class="tag weak">${q.concept} (${Math.round(templateMastery(q.id)*100)}%)</span>`).join('')}</div>` : ''}
  ${strong.length? `<h2 class="section">Strongest Concepts</h2><div class="concept-tags">${strong.map(q=>`<span class="tag strong">${q.concept} (${Math.round(templateMastery(q.id)*100)}%)</span>`).join('')}</div>` : ''}
  <h2 class="section">Week Progress</h2>
  <div class="week-grid">
    ${[1,2,3,4,5,6,7,8].map(w=>{
      const m = Math.round(weekMastery(w)*100);
      return `<div class="week-card" data-week="${w}">
        <div class="wk">Week ${w}</div>
        <div class="topic">${WEEK_TOPICS[w]}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${m}%"></div></div>
        <div class="small" style="margin-top:6px;">${m}% mastery</div>
      </div>`;
    }).join('')}
  </div>`;
}
function attachDashboardEvents(){
  document.querySelectorAll('.week-card').forEach(c=>c.addEventListener('click',()=>{
    startSession({weeks:[Number(c.dataset.week)], mode:'mixed'});
  }));
  document.getElementById('btn-continue').onclick = ()=> startSession({weeks:'all', mode:'smart'});
  document.getElementById('btn-mistakes').onclick = ()=> { VIEW.mode='mistakes'; render(); };
  document.getElementById('btn-weak').onclick = ()=> startSession({weeks:'all', mode:'weak'});
  document.getElementById('btn-original').onclick = ()=> startSession({weeks:'all', mode:'original'});
  document.getElementById('btn-variant').onclick = ()=> startSession({weeks:'all', mode:'variant'});
  document.getElementById('btn-test').onclick = ()=> { VIEW.mode='test-setup'; render(); };
}

/* ---------------- WEEKS ---------------- */
function weeksHTML(){
  return `<h2 class="section">Practice by Week</h2>
  <div class="week-grid">
    ${[1,2,3,4,5,6,7,8].map(w=>{
      const m = Math.round(weekMastery(w)*100);
      const ids = QUESTIONS.filter(q=>q.week===w).map(q=>q.id);
      const attempted = ids.filter(id=>STATE.attempts[id] && STATE.attempts[id].total>0).length;
      return `<div class="week-card" data-week="${w}">
        <div class="wk">Week ${w}</div>
        <div class="topic">${WEEK_TOPICS[w]}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${m}%"></div></div>
        <div class="small" style="margin-top:6px;">${m}% mastery · ${attempted}/${ids.length} attempted</div>
      </div>`;
    }).join('')}
  </div>`;
}
function attachWeeksEvents(){
  document.querySelectorAll('.week-card').forEach(c=>c.addEventListener('click',()=>{
    startSession({weeks:[Number(c.dataset.week)], mode:'mixed'});
  }));
}

/* ---------------- MISTAKE REVIEW ---------------- */
function mistakesHTML(){
  const withMistakes = QUESTIONS.filter(q=>STATE.attempts[q.id] && STATE.attempts[q.id].mistakes.length>0);
  if(withMistakes.length===0){
    return `<div class="empty-state"><h3>No mistakes recorded yet</h3><p>Once you get a question wrong, it'll show up here for targeted review.</p></div>`;
  }
  // repeated-mistake pattern detection: same concept missed 3+ times recently
  const conceptMissCounts = {};
  withMistakes.forEach(q=>{ conceptMissCounts[q.concept] = (conceptMissCounts[q.concept]||0) + STATE.attempts[q.id].mistakes.length; });
  const repeated = Object.entries(conceptMissCounts).filter(([c,n])=>n>=3).map(([c])=>c);
  let html = '';
  if(repeated.length){
    html += `<div class="repeated-alert">⚠ Repeated pattern detected: you've missed questions on <strong>${repeated.join(', ')}</strong> multiple times. Consider a focused review session on ${repeated.length>1?'these concepts':'this concept'}.</div>`;
  }
  html += `<h2 class="section">Mistake Review (${withMistakes.length})</h2>`;
  withMistakes.sort((a,b)=>templateMastery(a.id)-templateMastery(b.id)).forEach(q=>{
    const st = STATE.attempts[q.id];
    const last = st.mistakes[st.mistakes.length-1];
    html += `<div class="mistake-item">
      <div class="row">
        <div><strong>${q.id}</strong> · ${q.concept}</div>
        <span class="small">Mastery: ${Math.round(templateMastery(q.id)*100)}% · ${st.mistakes.length} mistake${st.mistakes.length>1?'s':''}</span>
      </div>
      <div class="small" style="margin-top:8px;">Last mistake: ${esc(last.yourAns)} → correct: ${esc(last.correctAns)}</div>
      <button class="ghost" style="margin-top:10px;" data-id="${q.id}">Practice this concept again</button>
    </div>`;
  });
  return html;
}
function attachMistakesEvents(){
  document.querySelectorAll('.mistake-item button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const q = QUESTIONS.find(x=>x.id===b.dataset.id);
      VIEW.queue = [{qDef:q, variant:true}];
      VIEW.qIndex = 0;
      VIEW.mode = 'question';
      VIEW.currentSession = {mode:'mistake-retry'};
      render();
    });
  });
}

/* ---------------- SESSION START ---------------- */
function startSession(opts){
  let pool = opts.weeks==='all' ? QUESTIONS.slice() : QUESTIONS.filter(q=>opts.weeks.includes(q.week));
  let queue = [];
  if(opts.mode==='original'){
    queue = pool.map(q=>({qDef:q, variant:false}));
  } else if(opts.mode==='variant'){
    queue = pool.map(q=>({qDef:q, variant:true}));
  } else if(opts.mode==='weak'){
    const attemptedPool = pool.filter(q=>STATE.attempts[q.id] && STATE.attempts[q.id].total>0);
    const base = attemptedPool.length? attemptedPool : pool;
    queue = base.sort((a,b)=>templateMastery(a.id)-templateMastery(b.id)).slice(0,12).map(q=>({qDef:q, variant:true}));
  } else if(opts.mode==='smart'){
    // priority: unseen first (mixed with low mastery), then spaced repetition-ish shuffle
    const scored = pool.map(q=>{
      const st = STATE.attempts[q.id];
      const seenScore = st? st.total : -1; // unseen = highest priority (most negative)
      const mastery = templateMastery(q.id);
      return {q, priority: (seenScore<0? -10 : mastery) };
    });
    scored.sort((a,b)=>a.priority-b.priority);
    queue = scored.slice(0,15).map(x=>({qDef:x.q, variant: !!(STATE.attempts[x.q.id] && STATE.attempts[x.q.id].total>0)}));
  } else { // mixed: original then variants shuffled
    pool.forEach(q=>{ queue.push({qDef:q, variant:false}); });
  }
  // shuffle order slightly (except keep deterministic-ish)
  queue = queue.sort(()=>Math.random()-0.5);
  VIEW.queue = queue;
  VIEW.qIndex = 0;
  VIEW.mode = 'question';
  VIEW.currentSession = opts;
  render();
}

/* ---------------- QUESTION SHELL ---------------- */
function questionShellHTML(){
  return `<div class="card" id="question-card"></div>
  <div class="footer-controls" id="footer-controls"></div>`;
}

function renderQuestion(){
  const item = VIEW.queue[VIEW.qIndex];
  if(!item){
    document.getElementById('question-card').innerHTML = `<div class="empty-state"><h3>Session complete</h3><p>Nice work — head back to the dashboard to see your updated mastery.</p></div>`;
    document.getElementById('footer-controls').innerHTML = `<button class="primary" id="back-dash">Back to Dashboard</button>`;
    document.getElementById('back-dash').onclick = ()=>{ VIEW.mode='dashboard'; render(); };
    return;
  }
  const qDef = item.qDef;
  const seed = Date.now() ^ Math.floor(Math.random()*1e9);
  const rng = makeRng(seed);
  let built = item.variant ? qDef.buildVariant(rng) : qDef.buildOriginal();
  // shuffle option order for original questions too (keep object shape), unless already shuffled
  CUR = {qDef, built, chosen:new Set(), submitted:false, hintLevel:0, isVariant:!!item.variant, testMode: VIEW.mode==='test-active'};
  paintQuestion();
}

function paintQuestion(){
  const item = VIEW.queue[VIEW.qIndex];
  const qDef = CUR.qDef, built = CUR.built;
  const total = VIEW.queue.length;
  const weekLabel = `Week ${qDef.week} · ${WEEK_TOPICS[qDef.week]}`;
  const modePill = CUR.isVariant ? '<span class="pill">Practice Variant</span>' : '<span class="pill mode-orig">Original Question</span>';
  let html = `<div class="qmeta"><span>${weekLabel} — Question ${VIEW.qIndex+1} of ${total}</span>${modePill}</div>`;
  html += `<div class="qtext">${mdish(built.text)}</div>`;
  html += `<div class="options" id="opts-container">`;
  built.options.forEach((o,i)=>{
    const letter = String.fromCharCode(97+i);
    html += `<div class="opt" data-idx="${i}"><span class="letter">${letter})</span><span>${mdish(o.t)}</span></div>`;
  });
  html += `</div>`;
  if(!CUR.submitted && !CUR.testMode){
    html += `<div id="hint-area"></div>`;
  }
  html += `<div class="btnrow">`;
  if(!CUR.submitted){
    html += `<button class="primary" id="submit-btn" disabled>Check Answer</button>`;
    if(!CUR.testMode) html += `<button class="ghost" id="hint-btn">Hint</button>`;
  } else {
    html += `<button class="primary" id="next-btn">${VIEW.qIndex+1<total? 'Next Question':'Finish'}</button>`;
  }
  html += `</div>`;
  if(CUR.submitted){
    html += feedbackHTML();
  }
  const st = STATE.attempts[qDef.id];
  if(st && st.total>0 && !CUR.testMode){
    html += `<div class="mastery-chip">Mastery on this concept: <div class="progress-mini"><span style="width:${Math.round(templateMastery(qDef.id)*100)}%"></span></div> ${Math.round(templateMastery(qDef.id)*100)}%
      ${st.streak>=3? `<span class="streak-badge">🔥 ${st.streak} streak</span>`:''}</div>`;
  }
  document.getElementById('question-card').innerHTML = html;
  const totalQ = VIEW.queue.length;
  document.getElementById('footer-controls').innerHTML = `
    <button class="ghost" id="quit-btn">${VIEW.mode==='test-active'?'Abandon Test':'Back to Dashboard'}</button>
    <span class="small">${VIEW.mode==='test-active' && VIEW.testTimer? '' : ''}</span>`;
  document.getElementById('quit-btn').onclick = ()=>{
    if(VIEW.mode==='test-active'){ if(confirm('Abandon this test? Your progress on it will be lost.')){ clearInterval(VIEW.testInterval); VIEW.mode='dashboard'; render(); } }
    else { VIEW.mode='dashboard'; render(); }
  };
  wireQuestionEvents();
  typeset();
}

function mdish(text){
  // minimal formatting: newlines -> <br>, preserve $..$ math untouched
  return esc(text).replace(/\n/g,'<br>');
}

function wireQuestionEvents(){
  const isMulti = !!CUR.built.multi;
  document.querySelectorAll('#opts-container .opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(CUR.submitted) return;
      const idx = Number(el.dataset.idx);
      if(isMulti){
        if(CUR.chosen.has(idx)) CUR.chosen.delete(idx); else CUR.chosen.add(idx);
      } else {
        CUR.chosen = new Set([idx]);
      }
      document.querySelectorAll('#opts-container .opt').forEach(o=>o.classList.remove('selected'));
      CUR.chosen.forEach(i=>{
        document.querySelector(`#opts-container .opt[data-idx="${i}"]`).classList.add('selected');
      });
      document.getElementById('submit-btn').disabled = CUR.chosen.size===0;
    });
  });
  const submitBtn = document.getElementById('submit-btn');
  if(submitBtn) submitBtn.addEventListener('click', submitAnswer);
  const hintBtn = document.getElementById('hint-btn');
  if(hintBtn) hintBtn.addEventListener('click', showHint);
  const nextBtn = document.getElementById('next-btn');
  if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
}

function showHint(){
  CUR.hintLevel = Math.min(CUR.hintLevel+1, 3);
  const hints = CUR.qDef.hints || [];
  let html = '';
  for(let i=0;i<CUR.hintLevel && i<hints.length;i++){
    html += `<div class="hint-box"><strong>Hint ${i+1}:</strong> ${mdish(hints[i])}</div>`;
  }
  document.getElementById('hint-area').innerHTML = html;
  typeset();
}

function submitAnswer(){
  const built = CUR.built;
  const isMulti = !!built.multi;
  const correctIdxs = built.options.map((o,i)=>o.correct?i:-1).filter(i=>i>=0);
  let isCorrect;
  if(isMulti){
    const chosenArr = Array.from(CUR.chosen).sort();
    const correctArr = correctIdxs.sort();
    isCorrect = chosenArr.length===correctArr.length && chosenArr.every((v,i)=>v===correctArr[i]);
  } else {
    isCorrect = built.options[Array.from(CUR.chosen)[0]].correct;
  }
  CUR.submitted = true;
  CUR.isCorrect = isCorrect;
  // record stats
  if(!CUR.testMode){
    const st = ensureTemplateStat(CUR.qDef.id);
    st.total++; st.lastSeenTs = Date.now();
    if(isCorrect){ st.correct++; st.streak++; }
    else {
      st.streak = 0;
      const yourAns = Array.from(CUR.chosen).map(i=>built.options[i].t).join('; ');
      const correctAns = correctIdxs.map(i=>built.options[i].t).join('; ');
      st.mistakes.push({ts:Date.now(), yourAns, correctAns, variantText: built.text});
      if(st.mistakes.length>8) st.mistakes.shift();
    }
    STATE.sessionLog.push({templateId:CUR.qDef.id, correct:isCorrect, ts:Date.now()});
    if(STATE.sessionLog.length>500) STATE.sessionLog.shift();
    saveState();
  } else {
    VIEW.testAnswers = VIEW.testAnswers||[];
    VIEW.testAnswers.push({qDef:CUR.qDef, isCorrect, built});
  }
  paintQuestion();
}

function feedbackHTML(){
  const built = CUR.built, qDef = CUR.qDef;
  const isMulti = !!built.multi;
  const chosenIdxs = Array.from(CUR.chosen);
  let html = `<div class="feedback ${CUR.isCorrect?'good':'bad'}">`;
  html += `<div class="verdict">${CUR.isCorrect? '✓ Correct' : '✕ Not quite'}</div>`;
  if(!CUR.isCorrect){
    const yourText = chosenIdxs.map(i=>built.options[i].t).join(' ; ');
    const correctText = built.options.filter(o=>o.correct).map(o=>o.t).join(' ; ');
    html += `<div><strong>Your answer:</strong> ${mdish(yourText)}</div>`;
    html += `<div><strong>Correct answer:</strong> ${mdish(correctText)}</div>`;
    html += `<h4>What went wrong?</h4>`;
    chosenIdxs.forEach(i=>{
      if(!built.options[i].correct){ html += `<div>${mdish(built.options[i].why)}</div>`; }
    });
    html += `<h4>Why the correct answer works</h4>`;
    built.options.filter(o=>o.correct).forEach(o=>{ html += `<div>${mdish(o.why)}</div>`; });
    html += `<h4>Concept being tested</h4><div>${mdish(qDef.concept)} — ${mdish(qDef.objective)}</div>`;
    if(qDef.tip) html += `<h4>Exam tip</h4><div>${mdish(qDef.tip)}</div>`;
  } else {
    html += `<h4>Why this is correct</h4>`;
    built.options.filter(o=>o.correct).forEach(o=>{ html += `<div>${mdish(o.why)}</div>`; });
    html += `<h4>Concept being tested</h4><div>${mdish(qDef.concept)} — ${mdish(qDef.objective)}</div>`;
  }
  html += `</div>`;
  return html;
}

function nextQuestion(){
  VIEW.qIndex++;
  if(VIEW.mode==='test-active'){
    if(VIEW.qIndex>=VIEW.queue.length){ finishTest(); return; }
  }
  render();
}
</script>
<script>
/* =========================================================
   TEST MODE
   ========================================================= */
function testSetupHTML(){
  return `<div class="card">
    <h2 style="margin-top:0;color:var(--navy);font-family:var(--serif);">Simulated Test 3</h2>
    <p class="small">No hints, no explanations during the test, no immediate correctness feedback. Questions are randomised (mix of original and variant questions across all 8 weeks). At the end you'll get a full breakdown.</p>
    <div style="margin:18px 0;">
      <label class="small">Number of questions</label><br>
      <select id="test-count" style="margin-top:6px;">
        <option value="10">10 questions (~10 min)</option>
        <option value="20" selected>20 questions (~20 min)</option>
        <option value="40">40 questions (~40 min)</option>
        <option value="80">80 — the full original bank</option>
      </select>
    </div>
    <div style="margin:18px 0;">
      <label class="small">Time limit</label><br>
      <select id="test-time" style="margin-top:6px;">
        <option value="0">No time limit</option>
        <option value="600">10 minutes</option>
        <option value="1200" selected>20 minutes</option>
        <option value="2400">40 minutes</option>
      </select>
    </div>
    <button class="primary" id="start-test-btn">Start Test</button>
  </div>`;
}
function attachTestSetupEvents(){
  document.getElementById('start-test-btn').onclick = ()=>{
    const count = Number(document.getElementById('test-count').value);
    const timeLimit = Number(document.getElementById('test-time').value);
    let pool = QUESTIONS.slice().sort(()=>Math.random()-0.5).slice(0,count);
    VIEW.queue = pool.map(q=>({qDef:q, variant: Math.random()<0.5}));
    VIEW.qIndex = 0;
    VIEW.testAnswers = [];
    VIEW.mode = 'test-active';
    VIEW.testStart = Date.now();
    VIEW.testTimeLimit = timeLimit;
    render();
    if(timeLimit>0){
      VIEW.testInterval = setInterval(()=>{
        const elapsed = Math.floor((Date.now()-VIEW.testStart)/1000);
        const remaining = timeLimit-elapsed;
        if(remaining<=0){ clearInterval(VIEW.testInterval); finishTest(); }
      },1000);
    }
  };
}
function finishTest(){
  if(VIEW.testInterval) clearInterval(VIEW.testInterval);
  const answers = VIEW.testAnswers||[];
  const correct = answers.filter(a=>a.isCorrect).length;
  const total = answers.length;
  const timeTaken = Math.floor((Date.now()-VIEW.testStart)/1000);
  // concept breakdown
  const byConcept = {};
  answers.forEach(a=>{
    const c = a.qDef.concept;
    if(!byConcept[c]) byConcept[c]={correct:0,total:0};
    byConcept[c].total++; if(a.isCorrect) byConcept[c].correct++;
  });
  const conceptArr = Object.entries(byConcept).map(([c,v])=>({concept:c, acc: v.correct/v.total, total:v.total}));
  conceptArr.sort((a,b)=>a.acc-b.acc);
  const weakest = conceptArr.slice(0,3);
  const strongest = conceptArr.slice(-3).reverse();
  const result = {ts:Date.now(), correct, total, timeTaken, weakest, strongest};
  STATE.testResults.push(result);
  if(STATE.testResults.length>20) STATE.testResults.shift();
  saveState();
  VIEW.lastTestResult = result;
  VIEW.mode = 'test-summary';
  render();
}
function testSummaryHTML(){
  const r = VIEW.lastTestResult;
  if(!r) return `<div class="empty-state">No recent test result.</div>`;
  const pct = Math.round(100*r.correct/r.total);
  const mins = Math.floor(r.timeTaken/60), secs = r.timeTaken%60;
  return `<div class="card">
    <h2 style="margin-top:0;color:var(--navy);font-family:var(--serif);">Test Result</h2>
    <div class="test-summary-grid">
      <div class="stat"><div class="num">${r.correct}/${r.total}</div><div class="lbl">Score</div></div>
      <div class="stat"><div class="num">${pct}%</div><div class="lbl">Accuracy</div></div>
      <div class="stat"><div class="num">${mins}:${String(secs).padStart(2,'0')}</div><div class="lbl">Time Taken</div></div>
    </div>
    <h4 style="margin-top:20px;">Weakest concepts this test</h4>
    <div class="concept-tags">${r.weakest.map(c=>`<span class="tag weak">${c.concept} (${Math.round(c.acc*100)}%)</span>`).join('') || '<span class="small">None recorded</span>'}</div>
    <h4>Strongest concepts this test</h4>
    <div class="concept-tags">${r.strongest.map(c=>`<span class="tag strong">${c.concept} (${Math.round(c.acc*100)}%)</span>`).join('') || '<span class="small">None recorded</span>'}</div>
    <h4>Recommended revision</h4>
    <p class="small">${r.weakest.length? `Focus on: ${r.weakest.map(c=>c.concept).join(', ')}.` : 'Great result — try a longer or timed test to keep sharpening.'}</p>
    <div class="btnrow" style="margin-top:20px;">
      <button class="primary" id="back-to-dash-2">Back to Dashboard</button>
      <button class="ghost" id="retest-weak">Practice These Weak Concepts</button>
    </div>
  </div>`;
}

function attachTestSummaryEvents(){
  const b1 = document.getElementById('back-to-dash-2');
  const b2 = document.getElementById('retest-weak');
  if(b1) b1.onclick = ()=>{ VIEW.mode='dashboard'; render(); };
  if(b2) b2.onclick = ()=>{
    const r = VIEW.lastTestResult;
    const weakConcepts = r.weakest.map(c=>c.concept);
    const pool = QUESTIONS.filter(q=>weakConcepts.includes(q.concept));
    VIEW.queue = pool.map(q=>({qDef:q, variant:true}));
    VIEW.qIndex = 0;
    VIEW.mode = 'question';
    VIEW.currentSession = {mode:'weak-retry'};
    render();
  };
}
</script>
<script>
/* =========================================================
   BOOT
   ========================================================= */
function checkMathJaxFallback(){
  setTimeout(()=>{
    if(window.__MJAX_FAILED__ || !window.MathJax || !window.MathJax.typesetPromise){
      const banner = document.createElement('div');
      banner.style.cssText = 'background:#fbeedd;color:#8a5a17;padding:10px 16px;text-align:center;font-size:13px;';
      banner.textContent = 'Math rendering library failed to load (no internet connection?) — formulas will show as raw LaTeX text, but everything else works normally.';
      document.body.insertBefore(banner, document.body.firstChild);
    }
  }, 3500);
}

window.addEventListener('DOMContentLoaded', ()=>{
  checkMathJaxFallback();
  render();
});
</script>
</body>
