<script>
/* =========================================================
   MCD4760 Test 3 Mastery Practice — Application Engine
   ========================================================= */
const LS_KEY = 'mcd4760_t3_progress_v1';

function defaultState(){
  return {
    attempts: {},      // templateId -> {seen:[], correct:0, total:0, streak:0, mistakes:[{ts,yourAns,correctAns,variantText}]}
    sessionLog: [],     // rolling log of {templateId, variantKind, correct, ts}
    testResults: [],
    lastVariantByTemplate: {}, // avoid immediate repeats
    createdAt: Date.now()
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){ console.warn('save failed', e); }
}
let STATE = loadState();

function ensureTemplateStat(id){
  if(!STATE.attempts[id]) STATE.attempts[id] = {correct:0, total:0, streak:0, mistakes:[], lastSeenTs:0};
  return STATE.attempts[id];
}
function templateMastery(id){
  const s = STATE.attempts[id];
  if(!s || s.total===0) return 0;
  // mastery blends accuracy with a recency-weighted streak bonus, capped at 100
  const acc = s.correct/s.total;
  const streakBonus = Math.min(s.streak,5)*0.03;
  return Math.max(0, Math.min(1, acc*0.85 + streakBonus));
}
function weekMastery(week){
  const ids = QUESTIONS.filter(q=>q.week===week).map(q=>q.id);
  const withData = ids.filter(id=>STATE.attempts[id] && STATE.attempts[id].total>0);
  if(withData.length===0) return 0;
  return withData.reduce((a,id)=>a+templateMastery(id),0)/ids.length;
}
function overallStats(){
  let attempted=0, correct=0;
  Object.values(STATE.attempts).forEach(s=>{attempted+=s.total; correct+=s.correct;});
  const ids = QUESTIONS.map(q=>q.id);
  const masteredCount = ids.filter(id=>templateMastery(id) >= 0.8 && STATE.attempts[id] && STATE.attempts[id].total>=2).length;
  const overallMastery = ids.reduce((a,id)=>a+templateMastery(id),0)/ids.length;
  // current streak = trailing correct answers in sessionLog
  let streak=0;
  for(let i=STATE.sessionLog.length-1;i>=0;i--){
    if(STATE.sessionLog[i].correct) streak++; else break;
  }
  return { attempted, correct, accuracy: attempted? Math.round(100*correct/attempted):0, masteredCount, totalTemplates: ids.length, overallMastery: Math.round(overallMastery*100), streak };
}
function weakestConcepts(n){
  const ids = QUESTIONS.map(q=>q.id).filter(id=>STATE.attempts[id] && STATE.attempts[id].total>=1);
  const sorted = ids.sort((a,b)=>templateMastery(a)-templateMastery(b));
  return sorted.slice(0,n).map(id=>QUESTIONS.find(q=>q.id===id));
}
function strongestConcepts(n){
  const ids = QUESTIONS.map(q=>q.id).filter(id=>STATE.attempts[id] && STATE.attempts[id].total>=1);
  const sorted = ids.sort((a,b)=>templateMastery(b)-templateMastery(a));
  return sorted.slice(0,n).map(id=>QUESTIONS.find(q=>q.id===id));
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function typeset(){
  if(window.MathJax && window.MathJax.typesetPromise){
    window.MathJax.typesetPromise().catch(()=>{});
  }
}

function esc(s){
  const d=document.createElement('div'); d.textContent=s; return d.innerHTML;
}

/* Simple seeded RNG so "variant kinds" are reproducible per click but still feel random */
function makeRng(seed){
  let s = seed >>> 0;
  return function(){
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function randInt(rng, lo, hi){ return lo + Math.floor(rng()*(hi-lo+1)); }
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }
function shuffleWithAnswer(rng, options, correctIndex){
  const idx = options.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [idx[i],idx[j]]=[idx[j],idx[i]];
  }
  const newOptions = idx.map(i=>options[i]);
  const newCorrect = idx.indexOf(correctIndex);
  return {options:newOptions, correctIndex:newCorrect};
}
</script>
<script>
/* =========================================================
   QUESTION BANK
   Each entry: original (verbatim, source of truth) + a
   variant generator that computes fresh numbers/labels and
   RECOMPUTES the correct answer programmatically (so
   variants are guaranteed mathematically correct rather than
   hand-typed). options are {t:text, correct:bool, why:string}
   ========================================================= */
const QUESTIONS = [];
function Q(spec){ QUESTIONS.push(spec); }
const WEEK_TOPICS = {
  1:'Sets & Set Notation', 2:'Functions', 3:'Theorems & Proofs',
  4:'Propositional Logic', 5:'Predicates & Quantifiers', 6:'Sequences',
  7:'Divisibility & Modular Arithmetic', 8:'Counting Principles'
};
</script>
<script>
// ---------- WEEK 1 : SETS ----------
Q({
  id:'W01-Q01', week:1, concept:'Set-builder notation for arithmetic progressions',
  objective:'Translate a verbal description ("positive multiples of k") into correct set-builder notation.',
  hints:['A multiple of 3 can always be written as 3 times some other integer.','Try the template $\\{3x : x \\in \\mathbb{Z}^+\\}$ — does it generate exactly the positive multiples of 3?','Check option (d): does it only list numbers, or does it *define* the whole infinite set formally?'],
  tip:'When a set is described as "multiples of k", the safest formal form is $\\{k \\cdot x : x \\in \\text{(domain)}\\}$ — it states the generating rule, not just examples.',
  buildOriginal: ()=>({
    text:'Which of the following best describes the set of all positive integers that are also multiples of 3?',
    options:[
      {t:'$\\{3x : x \\in \\mathbb{Z}^+\\}$', correct:true, why:'This correctly generates every positive multiple of 3: as $x$ ranges over all positive integers, $3x$ ranges over exactly $3,6,9,12,\\dots$'},
      {t:'$\\{x : 3x\\}$', correct:false, why:'This is not valid set-builder notation — "$3x$" is an expression, not a condition that $x$ must satisfy (a condition needs to evaluate to true/false).'},
      {t:'$\\{x \\text{ is a multiple of } 3 : x\\}$', correct:false, why:'The condition and the output expression are swapped — set-builder notation is $\\{\\text{expression} : \\text{condition}\\}$, not the reverse.'},
      {t:'$\\{3,6,9,12,15,\\dots\\}$', correct:false, why:'This is an informal roster listing (relying on the reader inferring the pattern), not a formal set-builder description — the question asks for the "best" formal description.'}
    ]
  }),
  buildVariant: (rng)=>{
    const k = pick(rng,[2,3,4,5,6,7]);
    const wrongForm = pick(rng,['cond-swap','bad-expr','roster']);
    const opts = [
      {t:`$\\{${k}x : x \\in \\mathbb{Z}^+\\}$`, correct:true, why:`As $x$ ranges over the positive integers, $${k}x$$ generates exactly the positive multiples of ${k}.`},
      {t:`$\\{x : ${k}x\\}$`, correct:false, why:`"$${k}x$" is an expression, not a true/false condition, so this is not valid set-builder syntax.`},
      {t:`$\\{x \\text{ is a multiple of } ${k} : x\\}$`, correct:false, why:'The expression and condition are written in the wrong order for set-builder notation $\\{\\text{expr} : \\text{cond}\\}$.'},
      {t:`$\\{${k},${2*k},${3*k},${4*k},\\dots\\}$`, correct:false, why:'A roster listing that relies on the reader spotting the pattern is informal, not a formal set-builder description.'}
    ];
    const s = shuffleWithAnswer(rng, opts.map(o=>o), 0);
    return {text:`Which of the following best describes the set of all positive integers that are also multiples of ${k}?`, options:s.options};
  }
});

Q({
  id:'W01-Q02', week:1, concept:'Equivalent formal representations of a finite set',
  objective:'Recognise that a set can be validly written in several equivalent forms (roster, reordered roster, set-builder) as long as it contains the same elements.',
  hints:['Sets are unordered — does reordering the elements change the set?','Try writing out the prime factors of the number in ascending order first.','Check whether the set-builder version describes exactly the same elements as the roster versions.'],
  tip:'A set has no inherent order, so any correctly-ordered or re-ordered roster of the same elements, plus an equivalent set-builder form, are all valid representations of one set.',
  buildOriginal: ()=>({
    text:'Suppose you have written out the set of prime factors of the number 30 in ascending order, and would like to represent these values as a set. Which of the following is NOT a valid formal representation of this set of values?',
    options:[
      {t:'$\\{2,3,5\\}$', correct:false, why:'This is exactly the prime factors of 30 in ascending order — a valid roster.'},
      {t:'$\\{3,5,2\\}$', correct:false, why:'Sets are unordered, so this is the same set as $\\{2,3,5\\}$ just written in a different order — still valid.'},
      {t:'$\\{n : n \\text{ is a prime factor of } 30\\}$', correct:false, why:'This set-builder description generates exactly $\\{2,3,5\\}$ — valid.'},
      {t:'All of the above are valid', correct:true, why:'Every option describes the same set $\\{2,3,5\\}$: order does not matter for sets, and the set-builder form generates the same elements.'}
    ]
  }),
  buildVariant: (rng)=>{
    const n = pick(rng,[30,42,60,70,105,66]);
    function primeFactors(num){ const f=[]; let d=2; while(d*d<=num){ while(num%d===0){ if(!f.includes(d)) f.push(d); num/=d; } d++; } if(num>1 && !f.includes(num)) f.push(num); return f.sort((a,b)=>a-b); }
    const pf = primeFactors(n);
    const reordered = [...pf].reverse();
    const opts = [
      {t:`$\\{${pf.join(',')}\\}$`, correct:false, why:`This is exactly the prime factors of ${n} in ascending order.`},
      {t:`$\\{${reordered.join(',')}\\}$`, correct:false, why:'Sets are unordered, so this lists the same elements as the ascending version — still valid.'},
      {t:`$\\{n : n \\text{ is a prime factor of } ${n}\\}$`, correct:false, why:`This generates exactly $\\{${pf.join(',')}\\}$ — valid.`},
      {t:'All of the above are valid', correct:true, why:`Every option represents the same set $\\{${pf.join(',')}\\}$ — order is irrelevant for sets, and the set-builder form matches.`}
    ];
    return {text:`Suppose you have written out the set of prime factors of the number ${n} in ascending order, and would like to represent these values as a set. Which of the following is NOT a valid formal representation of this set of values?`, options:opts};
  }
});

Q({
  id:'W01-Q03', week:1, concept:'The defining property of a set (no duplicates)',
  objective:'Recognise that a valid set listing cannot contain a repeated element — writing an element twice does not change the set, but is not how a set is properly written.',
  hints:['A set cannot contain the same element listed more than once.','Scan each option for any value that appears twice.','The empty set and single-element sets are still perfectly valid sets.'],
  tip:'If you ever see an element repeated in a "roster", that is not a valid way to write a set — the set itself just contains that element once.',
  buildOriginal: ()=>({
    text:'Which of the following collections of items is not a set?',
    options:[
      {t:'$\\{a,b,c,d,e,f,g,h,i,j,k,l,m,n,o,p,q,r,s,t,u,v,w,x,y,z\\}$', correct:false, why:'All 26 letters appear exactly once — a valid set.'},
      {t:'$\\{1,1,2,3,5,8,13\\}$', correct:true, why:'The element $1$ is listed twice. A set cannot contain a duplicate — this is not a valid way to write a set (it would just describe $\\{1,2,3,5,8,13\\}$).'},
      {t:'$\\{1,1/2,1/4,1/8,1/16,1/32,1/64\\}$', correct:false, why:'Seven distinct values, no repeats — a valid set.'},
      {t:'$\\{\\}$', correct:false, why:'The empty set is a perfectly valid set (it just has zero elements).'},
      {t:'a set of five distinct emoji', correct:false, why:'Five distinct symbols with no repeats — a valid set.'}
    ]
  }),
  buildVariant: (rng)=>{
    const base = pick(rng,[[2,4,6,8,10],[1,4,9,16,25],[3,6,9,12,15],[5,10,15,20,25]]);
    const dupIdx = randInt(rng,0,base.length-1);
    const withDup = [...base]; withDup.splice(dupIdx,0,base[dupIdx]);
    const opts = [
      {t:`$\\{${base.join(',')}\\}$`, correct:false, why:'Five distinct values, no repeats — a valid set.'},
      {t:`$\\{${withDup.join(',')}\\}$`, correct:true, why:`The value ${base[dupIdx]} is listed twice. A set cannot contain a duplicate — writing it twice doesn't change the set, but it isn't a valid way to write one.`},
      {t:'$\\{\\}$ (the empty set)', correct:false, why:'The empty set is a perfectly valid set.'},
      {t:'a set of four distinct colours', correct:false, why:'Four distinct elements, no repeats — a valid set.'}
    ];
    const s = shuffleWithAnswer(rng, opts, 1);
    return {text:'Which of the following collections of items is not a set?', options:s.options};
  }
});

Q({
  id:'W01-Q04', week:1, concept:'Cardinality comparison across finite, empty, and infinite sets',
  objective:'Compare the cardinality (size) of several sets, including a 1-element set, a finite numeric set, an empty set, and a set of very large numbers.',
  hints:['Cardinality just means "how many elements are in the set" — count each option.','A set containing one very long word is still only size 1.','Compare the actual element counts, not how big the numbers inside look.'],
  tip:'Don\'t be fooled by how "large" the elements look ($10^{100}$ is a huge *number*, but a set of four such numbers still only has cardinality 4).',
  buildOriginal: ()=>({
    text:'Select the set with the highest cardinality.',
    options:[

Q({
  id:'W01-Q08', week:1, concept:'Cardinality of a Cartesian power ($|A^k|=|A|^k$)',
  objective:'Compute the size of the k-fold Cartesian product of a finite set.',
  hints:['$A^3$ means $A\\times A\\times A$ — ordered triples where each entry comes from $A$.','If $|A|=n$, then $|A^k| = n^k$.','Count $|A|$ first, then raise it to the power 3.'],
  tip:'$|A^k| = |A|^k$. Don\'t confuse this with $k\\times|A|$ (that would be the sum rule, not the product rule).',
  buildOriginal: ()=>({
    text:'Suppose $A = \\{0,1,2\\}$. What is the size of $A^3$?',
    options:[
      {t:'Infinite', correct:false, why:'$A$ is finite, so any finite power of $A$ is also finite.'},
      {t:'27', correct:true, why:'$|A|=3$, so $|A^3| = 3^3 = 27$ — every ordered triple $(a,b,c)$ with $a,b,c\\in A$.'},
      {t:'9', correct:false, why:'$9=3^2$ is the size of $A^2$, not $A^3$.'},
      {t:'0', correct:false, why:'$A$ is non-empty, so $A^3$ is also non-empty.'},
      {t:'3', correct:false, why:'3 is just $|A|$ itself, not $|A|^3$.'},
      {t:'6', correct:false, why:'6 would be $3! $ (permutations of 3 distinct items), not $|A|^3$.'}
    ]
  }),
  buildVariant: (rng)=>{
    const size = randInt(rng,2,5);
    const A = Array.from({length:size},(_,i)=>i);
    const k = pick(rng,[2,3,4]);
    const correct = Math.pow(size,k);
    const opts = [
      {t:'Infinite', correct:false, why:'A finite base set raised to any finite power is still finite.'},
      {t:String(correct), correct:true, why:`$|A|=${size}$, so $|A^${k}| = ${size}^${k} = ${correct}$.`},
      {t:String(Math.pow(size,k-1)), correct:false, why:`This is $|A|^{${k-1}}$, one power too low.`},
      {t:String(size), correct:false, why:'This is just $|A|$ itself, not raised to any power.'},
      {t:String(size*k), correct:false, why:`This mistakenly multiplies $|A|$ by ${k}$ instead of raising it to the power ${k}$.`}
    ];
    const s = shuffleWithAnswer(rng, opts, 1);
    return {text:`Suppose $A = \\{${A.join(',')}\\}$. What is the size of $A^{${k}}$?`, options:s.options};
  }
});

      {t:'Students who receive a mark between 50 and 100 pass the unit.', correct:false, why:'This is a downstream interpretation of a grade, not the rule that produces the grade itself.'},
      {t:'Add up the grades of the individual assessments.', correct:false, why:'This is one plausible implementation detail, but too specific/narrow to be "the rule" being asked about generally.'}
    ]
  }),
  buildVariant: (rng)=>{
    const opts = [
      {t:'Each input is mapped to exactly one output according to a defined assignment process.', correct:true, why:'This is what a "rule" means for a function — the mechanism connecting input to output.'},
      {t:'The output values lie between 0 and 100.', correct:false, why:'This is a codomain fact, not the mapping mechanism.'},
      {t:'Outputs above 50 count as a pass.', correct:false, why:'This is an interpretation applied after the output is produced, not the rule generating it.'},
      {t:'The output is undefined for some inputs.', correct:false, why:'A function must be defined for every input — this contradicts the requirement of totality.'}

Q({
  id:'W02-Q06', week:2, concept:'Surjections (onto functions)',
  objective:'Identify which function definition is a surjection, i.e. its image equals its full codomain.',
  hints:['A surjection means every element of the codomain is actually "hit" by some input.','$f(x)=x^2$ on all reals never produces negative outputs — so a codomain of "all reals" would leave some values unreached.','Restrict the codomain to exactly the possible outputs (non-negative reals) to make $f(x)=x^2$ surjective.'],
  tip:'To check surjectivity: work out the image of $f$, then check whether it equals the *declared* codomain exactly.',
  buildOriginal: ()=>({
    text:'Which of the following is a surjection?',
    options:[
      {t:'$f(x) = x^2$, where the domain and codomain are both the set of integers.', correct:false, why:'Not every integer is a perfect square (e.g. 2 has no integer square root), so this is not surjective.'},
      {t:'$f(x) = x^2$, where the domain and codomain are both the set of real numbers.', correct:false, why:'Negative reals are never produced by $x^2$, so the codomain is not fully covered.'},
      {t:'$f(x) = x^2$, where the domain is the set of reals and the codomain is the set of non-negative reals.', correct:true, why:'Every non-negative real number $y$ has a real square root $\\sqrt{y}$, so the entire codomain is covered — this is surjective.'},
      {t:'$f(x) = x^2$, where the domain is the set of integers and the codomain is the set of positive integers.', correct:false, why:'Not every positive integer is a perfect square (e.g. 3), so the codomain is not fully covered.'}
    ]
  }),
  buildVariant: (rng)=>{
    const [dom,cod] = pick(rng,[['integers','integers'],['reals','reals'],['integers','positive integers']]);
    const opts = [
      {t:`$f(x)=x^2$, domain and codomain both the set of ${dom}.`, correct:false, why:`Not every value in the ${cod!==dom?cod:dom} arises as $x^2$ (negative or non-square values are missed).`},
      {t:'$f(x)=x^2$, domain the set of reals, codomain the set of non-negative reals.', correct:true, why:'Every non-negative real $y$ has $\\sqrt{y}$ as a valid real preimage, so the codomain is fully covered.'},
      {t:'$f(x)=x^2$, domain and codomain both the set of positive integers.', correct:false, why:'Not every positive integer is a perfect square (e.g. 2 or 3), so it is not surjective.'},
      {t:'$f(x)=x^3$, domain the integers, codomain the positive integers.', correct:false, why:'Negative integers cube to negative results, which are never positive — the codomain is not covered, and negative inputs even leave positives partially missed too.'}
    ];
    const s = shuffleWithAnswer(rng, opts, 1);
    return {text:'Which of the following is a surjection?', options:s.options};
  }
});

Q({
  id:'W02-Q08', week:2, concept:'Domain of a function defined over a Cartesian product',
  objective:'Identify the correct set of possible inputs (arguments) for a two-argument function whose domain is a Cartesian product of two sets.',
  hints:['If the domain is $\\{1,2,3\\}\\times\\{4,5\\}$, the inputs are ordered pairs, not single numbers.','List out every ordered pair $(x,y)$ with $x\\in\\{1,2,3\\}$ and $y\\in\\{4,5\\}$.','The rule $f(x,y)=x+y$ tells you the output, not the set of inputs.'],
  tip:'When a function\'s domain is stated as $A \\times B$, its inputs are literally the ordered pairs in that Cartesian product — list them systematically.',
  buildOriginal: ()=>({
    text:'Suppose function $f$ has domain $\\{1,2,3\\} \\times \\{4,5\\}$ and codomain $\\mathbb{Z}$, and has the rule that $f(x,y) = x + y$. What is the set of possible inputs (arguments) to this function?',
    options:[
      {t:'$\\mathbb{Z}$', correct:false, why:'This is the codomain (possible outputs), not the domain (inputs).'},
      {t:'$\\{(1,4),(1,5),(2,4),(2,5),(3,4),(3,5)\\}$', correct:true, why:'This lists exactly the 6 ordered pairs in $\\{1,2,3\\}\\times\\{4,5\\}$, which is the stated domain.'},
      {t:'$\\{1,2,3,4,5\\}$', correct:false, why:'This merges the two sets into one flat list, but the actual inputs are ordered PAIRS, not single numbers.'},
      {t:'$\\mathbb{Z}\\times\\mathbb{Z}$', correct:false, why:'This would be the domain if it were "all pairs of integers", but the actual domain is the specific finite set $\\{1,2,3\\}\\times\\{4,5\\}$.'}
    ]
  }),
  buildVariant: (rng)=>{
    const A = Array.from({length:randInt(rng,2,3)},(_,i)=>i+1);
    const B = Array.from({length:randInt(rng,2,3)},(_,i)=>i+10);
    const pairs=[]; A.forEach(a=>B.forEach(b=>pairs.push(`(${a},${b})`)));
    const opts = [
      {t:'$\\mathbb{Z}$', correct:false, why:'That describes the codomain, not the domain.'},
      {t:`$\\{${pairs.join(',')}\\}$`, correct:true, why:`This lists exactly the ordered pairs in $\\{${A.join(',')}\\}\\times\\{${B.join(',')}\\}$, the stated domain.`},
      {t:`$\\{${[...A,...B].join(',')}\\}$`, correct:false, why:'This flattens the two sets into single numbers, but the real inputs are ordered pairs.'},
      {t:'$\\mathbb{Z}\\times\\mathbb{Z}$', correct:false, why:'This would only be correct if the domain were "all pairs of integers", not this specific finite set.'}
    ];
    const s = shuffleWithAnswer(rng, opts, 1);
    return {text:`Suppose function $f$ has domain $\\{${A.join(',')}\\} \\times \\{${B.join(',')}\\}$ and codomain $\\mathbb{Z}$, with rule $f(x,y)=x+y$. What is the set of possible inputs (arguments) to this function?`, options:s.options};
  }
});

Q({
  id:'W02-Q09', week:2, concept:'Applying a function rule to determine membership of an ordered pair',
  objective:'Given a domain, codomain, and rule, determine which ordered pair $(x, f(x))$ actually belongs to the function.',
  hints:['The domain here is the negative integers — the first coordinate must be negative.','Apply the rule $f(x)=x+7$ to a valid domain element to find its matching output.','An ordered pair for a function is written $(\\text{input}, \\text{output})$.'],
  tip:'To check if $(a,b)$ belongs to a function: is $a$ in the domain, and does the rule really give $f(a)=b$?',
  buildOriginal: ()=>({
    text:'Consider the following function definition:\n\nDomain: The set of negative integers\nCodomain: The set of integers\nRule: $f(x) = x + 7$\n\nWhich of the following would be an ordered pair belonging to this function?',
    options:[
      {t:'$(8,1)$', correct:false, why:'8 is not a negative integer, so it cannot even be a valid input.'},
      {t:'$(1,8)$', correct:false, why:'1 is not a negative integer — invalid input.'},
      {t:'$(-1,-8)$', correct:false, why:'$-1$ is a valid input, but $f(-1) = -1+7 = 6$, not $-8$.'},
      {t:'$(-8,-1)$', correct:true, why:'$-8$ is a negative integer (valid input), and $f(-8) = -8+7 = -1$ — matches exactly.'}
    ]
  }),
  buildVariant: (rng)=>{
    const c = randInt(rng,2,12);
    const x = -randInt(rng,3,15);
    const y = x+c;
    const wrong1 = x+c+randInt(rng,1,3);
    const opts = [
      {t:`$(${-x},${-x+c})$`, correct:false, why:`${-x} is not a negative integer, so it can't even be a valid input.`},
      {t:`$(${x},${wrong1})$`, correct:false, why:`${x} is a valid input, but $f(${x})=${x}${c>=0?'+':''}${c}=${y}$, not ${wrong1}$.`},
      {t:`$(${x},${y})$`, correct:true, why:`${x} is a negative integer (valid input), and $f(${x})=${x}${c>=0?'+':''}${c}=${y}$ — matches.`},
      {t:`$(${y},${x})$`, correct:false, why:'The coordinates are reversed — this would only be valid if the pair were written (output, input).'}
    ];
    const s = shuffleWithAnswer(rng, opts, 2);
    return {text:`Consider the following function definition:\n\nDomain: The set of negative integers\nCodomain: The set of integers\nRule: $f(x) = x + ${c}$\n\nWhich of the following would be an ordered pair belonging to this function?`, options:s.options};
  }
});

      {t:'It is a surjection onto [1, 31].', correct:false, why:'Values 1 through 27 are never produced as a day-count, so the codomain [1,31] is not fully covered.'},
      {t:'Restricting the codomain to {30, 31} would still give a valid function.', correct:false, why:'February has 28 (or 29) days, which falls outside {30,31} — this would leave that input undefined, breaking totality.'},
      {t:'Every value in the codomain [1, 31] is achieved by some month.', correct:false, why:'Only 28, 29 (leap years), 30, and 31 ever occur — most values in [1,31] are never hit.'}
    ];
    return {text:`Consider the following function: Domain = months of the year; Codomain = all integers in [1, 31]; Rule: $f(\\text{month})=$ number of days in that month in ${year}. Which statement is true with respect to this function?`, options:opts};
  }
});

  hints:['A theorem must be a statement that has been proven true, stated in general terms.','A question ("how many subsets...") is not itself a statement — it can\'t be a theorem.','An unproven claim, even a widely believed one (like Goldbach\'s conjecture), is a conjecture, not a theorem.'],

Q({

  objective:'Identify which listed step would NOT be a logically valid move within a proof.',
  hints:['Substituting a known equality into an expression is always valid.','Using modus ponens (if $P_1$ true and $P_1\\Rightarrow P_2$, then $P_2$ true) is a valid deduction.','Citing an already-proven theorem is valid — but checking only finitely many cases and generalising to "all" is NOT a valid proof step on its own.'],
  tip:'Verifying a claim for a few specific values (e.g. $x=1,2,3,4$) never proves it for ALL values — that requires induction or a general argument, not spot-checking.',
  buildOriginal: ()=>({
    text:'Which of the following would NOT be a valid step to include as part of a proof?',
    options:[
      {t:'Since we know that $x=a+b$ and $f(x)=x^2$, we can also say that $f(x) = (a+b)^2$.', correct:false, why:'Valid — this is direct substitution of $x=a+b$ into the definition of $f$.'},
      {t:'Since we know that $P_1$ is true, and $P_1 \\Rightarrow P_2$, we can also say that $P_2$ is true.', correct:false, why:'Valid — this is modus ponens, a fundamental and legitimate rule of logical deduction.'},
      {t:'By Theorem $n$, which was proved previously, we know that $P(x)$ is true for all positive integers.', correct:false, why:'Valid — citing an already-established theorem is a standard and legitimate proof step.'},
      {t:'We have shown that $P(x)$ is true for $x = 1,2,3,4$; therefore we can deduce it is true for all other positive integers.', correct:true, why:'INVALID — checking only 4 specific cases does not logically establish the claim for every positive integer. This kind of generalisation requires a general argument or a formal induction proof, not spot-checking finitely many cases.'}
    ]
  }),
  buildVariant: (rng)=>{
    const n = randInt(rng,3,6);

      {t:'Since $Q_1$ is true, and $Q_1\\Rightarrow Q_2$, we can also say $Q_2$ is true.', correct:false, why:'Valid — this is modus ponens.'},
      {t:'By a previously-proven theorem, we know $R(x)$ holds for all integers.', correct:false, why:'Valid — citing an established result is legitimate.'},
      {t:`We have shown $S(x)$ is true for $x=${cases}$; therefore it must be true for all other positive integers.`, correct:true, why:`Invalid — checking only ${n} specific cases does not establish the claim for every positive integer; this needs induction or a general argument.`}

  }
});

Q({

  objective:'Diagnose a proof where the final conclusion does not actually follow from the premises given, even though the premises themselves may be fine.',
  hints:['Check whether the third statement is actually implied by the first two, or if it\'s a leap.','$A\\wedge B\\Rightarrow C$ combined with "$A$ true, $B$ false" tells you nothing about $C$ (the antecedent $A\\wedge B$ is false).','When the antecedent of an implication is false, the implication gives no information about the consequent.'],

    text:'What, if anything, is wrong with the following sequence of proof steps?\n1. We already know that if A and B are both true, then C is also true.\n2. Our initial assumptions state that A is true, but B is false.\n3. Therefore, C is false.',
    options:[
      {t:'Statement 3 does not follow as a logical consequence of the previous statements.', correct:true, why:'Since $B$ is false, the premise $A\\wedge B$ is false, so the implication "$A\\wedge B \\Rightarrow C$" tells us nothing at all about $C$\'s truth value — concluding $C$ is false is an unjustified leap.'},
      {t:'There is nothing wrong with the proof steps.', correct:false, why:'There IS a problem — the conclusion about $C$ does not logically follow from a false antecedent.'},
      {t:'The sequence is out of order.', correct:false, why:'Ordering is not the issue here; the logical link between steps 2 and 3 is what fails.'},
      {t:'We cannot make assumptions about the truth values of A and B.', correct:false, why:'Making assumptions is a standard and valid part of constructing a proof — that is not the flaw here.'}
    ]
  }),
  buildVariant: (rng)=>{

      {t:'There is nothing wrong with the proof steps.', correct:false, why:'The conclusion does not actually follow from a false antecedent.'},
      {t:'The steps are presented in the wrong order.', correct:false, why:'Ordering isn\'t the issue — the logical gap between the premises and conclusion is.'},
      {t:'We are not permitted to make assumptions in a proof.', correct:false, why:'Assumptions are a normal, valid part of proof construction.'}
    ];
    return {text:`What, if anything, is wrong with the following sequence of proof steps?\n1. We already know that if ${p} and ${q} are both true, then ${r} is also true.\n2. Our initial assumptions state that ${p} is true, but ${q} is false.\n3. Therefore, ${r} is false.`, options:opts};

Q({

  tip:'Modus ponens: from "$P$" and "$P\\Rightarrow Q$", conclude "$Q$". Confusing this with "affirming the consequent" (assuming $Q$ true to conclude $P$) is a classic logical fallacy.',
  buildOriginal: ()=>({
    text:'Which of the following defines the principle of logical deduction, or modus ponens?',
    options:[
      {t:'If Q is true, and P implies Q, then P is true.', correct:false, why:'This is the fallacy of "affirming the consequent" — knowing $Q$ is true does not let you conclude $P$ is true.'},
      {t:'If P and Q are true, then P implies Q.', correct:false, why:'This reverses the logic — having both true doesn\'t define what modus ponens states as a deduction rule.'},
      {t:'If P is true, and P implies Q, then Q is true.', correct:true, why:'This is exactly modus ponens: from $P$ and $P\\Rightarrow Q$, we validly deduce $Q$.'},
      {t:'If P implies Q, then Q is true.', correct:false, why:'This is missing the crucial premise that $P$ itself is true — an implication alone doesn\'t tell us its consequent is true.'}
    ]
  }),
  buildVariant: (rng)=>{
    const [p,q] = pick(rng,[['A','B'],['R','S'],['X','Y']]);

      {t:`If ${p} is true, and ${p} implies ${q}, then ${q} is true.`, correct:true, why:'This is exactly modus ponens.'},
      {t:`If ${p} and ${q} are both true, then ${p} implies ${q}.`, correct:false, why:'This does not correctly state the modus ponens deduction rule.'},
      {t:`If ${p} implies ${q}, then ${q} must be true.`, correct:false, why:`This is missing the premise that ${p}$ itself is true.`}
    ];

    return {text:'Which of the following defines the principle of logical deduction, or modus ponens?', options:s.options};

      {t:'If P is true, then Q is also true.', correct:true, why:'This is exactly the meaning of $P\\Rightarrow Q$: whenever the antecedent $P$ holds, the consequent $Q$ must also hold.'},

Q({
  id:'W04-Q02', week:4, concept:'A proposition must have a definite truth value',
  objective:'Identify which of several statements is NOT a proposition, i.e. does not have a definite truth value.',
  hints:['A proposition must be a statement that is definitely either true or false.','Check each statement: can you assign it a truth value with certainty?','"Hello world" doesn\'t assert anything that could be true or false.'],
  tip:'A proposition needs a definite truth value. Greetings, commands, and questions are not propositions.',
  buildOriginal: ()=>({
    text:'Which of the following is NOT an example of a proposition?',
    options:[
      {t:'The cheque is in the mail.', correct:false, why:'This is a definite claim that is either true or false — a valid proposition.'},
      {t:'12 - 5 = 6', correct:false, why:'This is a mathematical claim with a definite truth value (in this case, false) — still a proposition.'},
      {t:'6 + 7 = 13', correct:false, why:'A definite mathematical claim (true) — a proposition.'},
      {t:'The backbone of any proof consists of its logical deductions.', correct:false, why:'A declarative claim that is either true or false — a proposition.'},
      {t:'Hello world.', correct:true, why:'A greeting doesn\'t assert anything that is true or false — it has no truth value, so it is not a proposition.'}
    ]
  }),
  buildVariant: (rng)=>{
    const a = randInt(rng,3,20), b=randInt(rng,3,20);
    const trueSum = a+b;
    const claimedSum = pick(rng,[trueSum, trueSum+randInt(rng,1,3)]);
    const greeting = pick(rng,['Good morning!','Please close the door.','What time is it?']);
    const opts = [
      {t:`${a} + ${b} = ${claimedSum}`, correct:false, why:`This is a definite mathematical claim (${claimedSum===trueSum?'true':'false'} in this case) — still a proposition, since it has a definite truth value.`},
      {t:'The sky is a colour.', correct:false, why:'A definite (true) claim — a proposition.'},
      {t:'Every triangle has three sides.', correct:false, why:'A definite (true) claim — a proposition.'},
      {t:greeting, correct:true, why:'This does not assert anything that is true or false, so it has no truth value and is not a proposition.'}
    ];
    return {text:'Which of the following is NOT an example of a proposition?', options:opts};
  }
});

Q({
  id:'W04-Q03', week:4, concept:'Meaning of logical OR ($\\vee$) — inclusive disjunction',
  objective:'Correctly interpret $X \\vee Y$ as "X or Y or both" (inclusive or), not exclusive or.',
  hints:['Logical OR ($\\vee$) is inclusive — it allows both to be true at once.','Rule out any description that says "but not both" — that would be XOR, not OR.','Rule out descriptions that require both to happen, or neither.'],
  tip:'$X \\vee Y$ is true whenever at least one of $X,Y$ is true — including when both are true. This is different from exclusive-or ($\\oplus$).',
  buildOriginal: ()=>({
    text:'If X is the proposition "It will be sunny tomorrow" and Y is the proposition "It will be sunny the day after tomorrow", then $X \\vee Y$ could be described as:',
    options:[
      {t:'It will either be sunny tomorrow, or the day after, or both.', correct:true, why:'This is exactly the inclusive-or meaning of $\\vee$: true when at least one (possibly both) of $X,Y$ holds.'},
      {t:'It will be sunny both tomorrow and the day after.', correct:false, why:'This describes $X \\wedge Y$ (AND), requiring both — too strict for $\\vee$.'},
      {t:'It will either be sunny tomorrow, or the day after, but not both.', correct:false, why:'This describes exclusive-or ($X \\oplus Y$), which explicitly rules out both being true — $\\vee$ allows both.'},
      {t:'It will not be sunny either tomorrow or the day after.', correct:false, why:'This describes $\\neg X \\wedge \\neg Y$ (neither), the opposite of what $\\vee$ asserts.'}
    ]
  }),
  buildVariant: (rng)=>{
    const [x,y] = pick(rng,[['It will rain today','It will rain tomorrow'],['The server is up','The backup server is up'],['Alice attends the meeting','Bob attends the meeting']]);
    const opts = [
      {t:`${x}, or ${y.charAt(0).toLowerCase()+y.slice(1)}, or both.`, correct:true, why:'This is the inclusive-or meaning of $\\vee$ — true when at least one (possibly both) holds.'},
      {t:`${x} and ${y.charAt(0).toLowerCase()+y.slice(1)}.`, correct:false, why:'This describes AND ($\\wedge$), requiring both — too strict for $\\vee$.'},
      {t:`Either ${x.charAt(0).toLowerCase()+x.slice(1)} or ${y.charAt(0).toLowerCase()+y.slice(1)}, but not both.`, correct:false, why:'This describes exclusive-or, not the inclusive $\\vee$.'},
      {t:`Neither ${x.charAt(0).toLowerCase()+x.slice(1)} nor ${y.charAt(0).toLowerCase()+y.slice(1)}.`, correct:false, why:'This is the opposite of what $\\vee$ asserts.'}
    ];
    const s = shuffleWithAnswer(rng, opts, 0);
    return {text:`If X is the proposition "${x}" and Y is the proposition "${y}", then $X \\vee Y$ could be described as:`, options:s.options};
  }
});

  buildVariant: (rng)=>{
    const pv = pick(rng,[true,false]);
    const qv = pv ? false : pick(rng,[true,false]); // exclude (True,True): not enough False options remain to fill 4 choices with exactly 1 correct
    const T = 'True', F = 'False';
    const pS = pv?T:F, qS = qv?T:F;
    function evalExpr(kind){
      const np=!pv, nq=!qv;
      switch(kind){
        case 'P^Q': return pv&&qv;
        case 'PvQ': return pv||qv;
        case '~P^Q': return np&&qv;
        case '~PvQ': return np||qv;
        case 'P^~Q': return pv&&nq;
        case 'Pv~Q': return pv||nq;
      }
    }
    const kinds = ['P^Q','PvQ','~P^Q','~PvQ','P^~Q','Pv~Q'];
    const labelMap = {'P^Q':'$P \\wedge Q$','PvQ':'$P \\vee Q$','~P^Q':'$\\neg P \\wedge Q$','~PvQ':'$\\neg P \\vee Q$','P^~Q':'$P \\wedge \\neg Q$','Pv~Q':'$P \\vee \\neg Q$'};
    // pick 4 distinct kinds ensuring exactly one true (retry until found or just pick and mark accordingly)
    let chosen = [];
    let shuffled = [...kinds].sort(()=>rng()-0.5);
    let trueOnes = shuffled.filter(k=>evalExpr(k));
    let falseOnes = shuffled.filter(k=>!evalExpr(k));
    if(trueOnes.length===0 || falseOnes.length<3){ chosen = shuffled.slice(0,4); }
    else { chosen = [trueOnes[0], ...falseOnes.slice(0,3)]; }
    chosen = chosen.sort(()=>rng()-0.5);
    const opts = chosen.map(k=>{
      const val = evalExpr(k);
      let why;
      if(k==='P^Q') why = `$P\\wedge Q = ${pS}\\wedge ${qS} = ${val?T:F}$.`;
      if(k==='PvQ') why = `$P\\vee Q = ${pS}\\vee ${qS} = ${val?T:F}$.`;
      if(k==='~P^Q') why = `$\\neg P = ${(!pv)?T:F}$, so $\\neg P \\wedge Q = ${(!pv)?T:F}\\wedge ${qS} = ${val?T:F}$.`;
      if(k==='~PvQ') why = `$\\neg P = ${(!pv)?T:F}$, so $\\neg P \\vee Q = ${(!pv)?T:F}\\vee ${qS} = ${val?T:F}$.`;
      if(k==='P^~Q') why = `$\\neg Q = ${(!qv)?T:F}$, so $P \\wedge \\neg Q = ${pS}\\wedge ${(!qv)?T:F} = ${val?T:F}$.`;
      if(k==='Pv~Q') why = `$\\neg Q = ${(!qv)?T:F}$, so $P \\vee \\neg Q = ${pS}\\vee ${(!qv)?T:F} = ${val?T:F}$.`;
      return {t:labelMap[k], correct:val, why};
    });
    return {text:`Suppose P is a variable with the value ${pS}, and Q is a variable with the value ${qS}. Which of the following expressions evaluates to True?`, options:opts};
  }
});

Q({

  hints:['Since it "gives the square", its output is a NUMBER — so this is a function, not a predicate.','The input (domain) is any integer, so the domain is $\\mathbb{Z}$.','A square of any integer is never negative, so the codomain should be non-negative integers, $\\mathbb{N}\\cup\\{0\\}$.'],

      {t:'It is a function with domain $\\mathbb{N}\\cup\\{0\\}$ and codomain $\\mathbb{Z}$.', correct:false, why:'This swaps domain and codomain incorrectly — the input should be all integers, and the output should be restricted to non-negative values.'},
      {t:'It is a predicate with domain $\\mathbb{N}\\cup\\{0\\}$ and codomain $\\mathbb{Z}$.', correct:false, why:'The output here is a number (the square), not True/False, so this cannot be a predicate.'},
      {t:'It is a predicate with domain $\\mathbb{Z}$ and codomain $\\mathbb{N}\\cup\\{0\\}$.', correct:false, why:'The output is a number, not True/False, so this cannot be a predicate.'}

Q({

Q({

  objective:'Identify the option that is a genuine, complete recursive definition (with base case(s) and a recurrence step), as opposed to a list of explicit terms or an incomplete recurrence.',
  hints:['A recursive definition needs (1) base case(s) and (2) a rule expressing later terms using earlier ones.','Listing out specific values (like f1=1,f2=4,f3=9...) is NOT itself a recursive definition — it\'s just a table of values.','A recurrence missing a base case (like fn=f(n-1)+2 alone) is incomplete.'],
  tip:'A complete recursive definition = base case(s) + a rule for $f_n$ in terms of earlier terms (like $f_{n-1}$, $f_{n-2}$).',
  buildOriginal: ()=>({
    text:'Which of the following gives a complete recursive definition of a sequence?',
    options:[
      {t:'$f_1=1, f_2=4, f_3=9, f_4=16, f_5=25$', correct:false, why:'This just lists specific computed values — it is not a rule for generating further terms, so it\'s not a recursive definition at all.'},
      {t:'$f_1=1, f_2=1, f_n = f_{n-1}+f_{n-2}$', correct:true, why:'This has base cases ($f_1,f_2$) AND a recurrence rule expressing later terms via earlier ones — the (complete) Fibonacci definition.'},
      {t:'$f_n = f_{n-1}+2$', correct:false, why:'This recurrence has no base case — without knowing $f_1$ (or some starting value), the sequence is undefined.'},
      {t:'$f_n = (2n-1 : n \\in \\mathbb{N})$', correct:false, why:'This is a closed-form (explicit) definition, not a recursive one — it computes $f_n$ directly from $n$, not from earlier terms.'}
    ]
  }),
  buildVariant: (rng)=>{
    const opts = [
      {t:'$f_1=2, f_2=6, f_3=12, f_4=20, f_5=30$', correct:false, why:'Just a list of specific values, not a generating rule — not recursive.'},
      {t:'$f_1=1, f_2=2, f_n=f_{n-1}+f_{n-2}$', correct:true, why:'Has base cases plus a genuine recurrence rule — a complete recursive definition.'},
      {t:'$f_n = 3f_{n-1}$', correct:false, why:'Missing a base case, so the sequence is undefined without a starting value.'},
      {t:'$f_n = n^2+1$', correct:false, why:'This is a closed-form definition, computing $f_n$ directly from $n$, not recursively.'}
    ];
    return {text:'Which of the following gives a complete recursive definition of a sequence?', options:opts};
  }
});

Q({

      {t:'$f_1=1, f_n = 2^{f_{n-1}}\\times 2$', correct:false, why:'This exponentiates $f_{n-1}$ itself, which grows far too fast — check: $f_2$ would be $2^1\\times2=4$, not 2.'},
      {t:'$f_1=1, f_n = (n-1)\\times 2$', correct:false, why:'This is linear growth, not matching the doubling pattern (e.g. gives $f_3=4$, not the correct value of 4 — but check $f_4$: gives 6, not 8).'},

      {t:`$f_1=1, f_n = (n-1)\\times ${r}$`, correct:false, why:'This grows linearly, not matching the geometric (multiplicative) pattern.'},
      {t:`$f_1=1, f_n = f_{n-1}+${r}$`, correct:false, why:'This is arithmetic (adding a constant) rather than geometric (multiplying by a constant ratio).'}
    ];
    return {text:`Consider the sequence defined by $f_n = ${r}^{n-1}$, which begins ${terms.join(', ')}... Which of the following is a correct recursive definition of this sequence?`, options:opts};
  }
});

    text:'What is $-10 \\bmod 3$ equal to?',
    options:[
      {t:'2', correct:true, why:'$-10 = (-4)\\times 3 + 2$, and $2$ is in the valid range $[0,3)$ — so $-10\\bmod 3=2$.'},
      {t:'-1', correct:false, why:'The mod result must be non-negative — $-1$ is outside the valid range $[0,3)$.'},
      {t:'-2', correct:false, why:'The mod result must be non-negative — this is outside the valid range.'},
      {t:'1', correct:false, why:'$-10=(-4)\\times3+2$, not $+1$ — check: $(-4)\\times3=-12$, and $-12+2=-10$. So the remainder is 2, not 1.'}
    ]
  }),
  buildVariant: (rng)=>{
    const d = pick(rng,[3,4,5,6,7]);
    const n = -randInt(rng,d+1,d*6);

    const r = n - q*d;
    const wrong1 = r-d, wrong2 = (r+1)%d, wrong3 = d-r;
    const opts = [
      {t:String(r), correct:true, why:`$${n} = (${q})\\times ${d} + ${r}$, and ${r} is in the valid range $[0,${d})$ — so $${n}\\bmod ${d}=${r}$.`},
      {t:String(wrong1), correct:false, why:'The mod result must be non-negative — this value is outside the valid range.'},
      {t:String(wrong3===r?r-1:wrong3), correct:false, why:`Doesn't satisfy $${n} = q\\times ${d} + r$ for an integer q with r in $[0,${d})$.`},
      {t:String((r+1)%d===r?r+2:(r+1)%d), correct:false, why:'An arithmetic slip — recompute using the division algorithm carefully.'}
    ];
    return {text:`What is $${n} \\bmod ${d}$ equal to?`, options:opts};
  }
});

Q({

      {t:`$d > ${r}$`, correct:false, why:`The remainder must always be strictly less than the divisor, so $d>${r}$ must hold.`},
      {t:'$d \\nmid n$', correct:false, why:`If $d$ divided $n$ exactly, the remainder would be 0, not ${r}$ — so this must be true.`}

  }

Q({
  id:'W07-Q10', week:7, concept:'Extracting the fractional part of a ratio using mod',
  objective:'Express the fractional part of $x/y$ (for positive integers $x>y$, non-integer ratio) in terms of the mod operation.',
  hints:['If $n=x/y$ is not an integer, then $x = qy+r$ where $r=x\\bmod y$ and $0<r<y$.','The integer part of $n$ is $q$; the fractional part is $r/y$.','Match this to $(x \\bmod y)/y$.'],
  tip:'For $n=x/y$: integer part = $\\lfloor x/y \\rfloor$; fractional part = $(x \\bmod y)/y$.',
  buildOriginal: ()=>({
    text:'Suppose that x and y are positive integers, where x > y. Let n = x/y, and suppose that n is not an integer. The value n can be expressed as an integer part and a fractional part, where the fractional part is between 0 and 1. Using this representation, the fractional part would be equal to:',
    options:[
      {t:'$(y \\bmod x)/x$', correct:false, why:'Since $x>y$, $y \\bmod x$ is just $y$ itself (as $y<x$) — this doesn\'t correctly capture the fractional part of $x/y$.'},
      {t:'$y \\bmod x$', correct:false, why:'This isn\'t even a fraction between 0 and 1 in general, and uses the wrong operands.'},
      {t:'$(y \\bmod x)/y$', correct:false, why:'Same issue — $y \\bmod x$ simplifies trivially to $y$ since $y<x$, so this expression just becomes 1, which is wrong.'},
      {t:'$(x \\bmod y)/x$', correct:false, why:'The remainder is being divided by the wrong number ($x$ instead of $y$).'},
      {t:'$x \\bmod y$', correct:false, why:'This gives the remainder itself, not the fractional part (which requires dividing by $y$).'},
      {t:'$(x \\bmod y)/y$', correct:true, why:'$x=qy+r$ where $r=x\\bmod y$; dividing through by $y$ gives $x/y = q + r/y$, so the fractional part is exactly $r/y = (x\\bmod y)/y$.'}
    ]
  }),
  buildVariant: (rng)=>{
    const y = randInt(rng,4,9);
    const q = randInt(rng,2,5);
    const r = randInt(rng,1,y-1);
    const x = q*y+r;
    const opts = [
      {t:'$(y \\bmod x)/x$', correct:false, why:`Since $y<x$, $y\\bmod x$ is just $y$ — doesn't correctly represent the fractional part.`},
      {t:'$(x \\bmod y)/y$', correct:true, why:`$x=${q}\\times${y}+${r}$, so $x\\bmod y=${r}$; dividing by $y$ gives the fractional part $${r}/${y}$.`},
      {t:'$(x \\bmod y)/x$', correct:false, why:'The remainder should be divided by $y$, not $x$.'},
      {t:'$x \\bmod y$', correct:false, why:'This is just the remainder itself — the fractional part additionally requires dividing by $y$.'}
    ];
    return {text:`Suppose $x=${x}$ and $y=${y}$ (so x > y), and let $n=x/y$, which is not an integer. The value n can be split into an integer part and a fractional part (between 0 and 1). Which expression gives the fractional part, in general, for positive integers x>y?`, options:opts};
  }
});

    text:'A password consists of 3 characters: the first is a digit (0–9), the second is a lowercase letter (26 choices), and the third is either a digit or a lowercase letter. How many different passwords are possible?',
    options:[
      {t:'$10 \\times 26 + 36$', correct:false, why:'This incorrectly adds the third position\'s choices instead of multiplying — all three positions should be combined by multiplication.'},
      {t:'$10 + 26 + 36$', correct:false, why:'This uses the SUM rule throughout, but each position is chosen independently and simultaneously — that calls for the PRODUCT rule.'},
      {t:'$10 \\times 26 \\times 36$', correct:true, why:'Each position\'s choices are independent, so by the product rule, total passwords = $10\\times26\\times36$.'},
      {t:'$10^{26^{36}}$', correct:false, why:'This wildly overcomplicates the calculation — there\'s no reason for nested exponentiation here.'}
    ]
  }),
  buildVariant: (rng)=>{
    const n1 = pick(rng,[10,8]);
    const n2 = pick(rng,[26,24]);
    const n3 = n1+n2;
    const len = pick(rng,[3,4]);
    const correct = len===3 ? n1*n2*n3 : n1*n2*n3*n3;
    const exprCorrect = len===3? `${n1} \\times ${n2} \\times ${n3}` : `${n1} \\times ${n2} \\times ${n3} \\times ${n3}`;
    const exprSum = len===3? `${n1} + ${n2} + ${n3}` : `${n1} + ${n2} + ${n3} + ${n3}`;
    const opts = [
      {t:`$${exprSum}$`, correct:false, why:'Adding the choices is wrong here — each position is chosen independently and simultaneously, which calls for multiplication.'},
      {t:`$${exprCorrect}$`, correct:true, why:'Each position\'s choices are independent, so the product rule gives the total count by multiplying them together.'},
      {t:`$${n1} \\times (${n2}+${n3})$`, correct:false, why:'This mixes addition and multiplication incorrectly — every position\'s choice count should be a separate multiplicative factor.'},
      {t:`$${n1}^{${len}}$`, correct:false, why:'This assumes every position has the same number of choices as the first position, which is not the case here.'}
    ];
    const positions = len===3? `the first is a digit (0–${n1-1}), the second is a lowercase letter (${n2} choices), and the third is either a digit or a lowercase letter (${n3} choices)` : `the first is a digit (0–${n1-1}), the second is a lowercase letter (${n2} choices), and the third and fourth are each either a digit or a lowercase letter (${n3} choices each)`;
    return {text:`A password consists of ${len} characters: ${positions}. How many different passwords are possible?`, options:opts};
  }
});

Q({
  id:'W08-Q09', week:8, concept:'The addition principle with overlapping categories (inclusion of shared elements)',
  objective:'Correctly count the number of choices when selecting from the UNION of two overlapping categories (even numbers OR prime numbers), being careful not to double count shared elements.',
  hints:['List the even numbers in the set, and separately list the prime numbers.','Combine the two lists into a single set — remember, 2 is BOTH even and prime, so don\'t count it twice.','Count the DISTINCT numbers in the combined (union) list.'],
  tip:'When two categories overlap, the count of "A or B" is $|A|+|B|-|A\\cap B|$ — always double-check for double-counted shared elements.',
  buildOriginal: ()=>({
    text:'Suppose you are choosing a number from the set $S = \\{1,2,3,4,5,6\\}$. You may either choose an even number, or choose a prime number. How many choices do you have?',
    options:[
      {t:'3', correct:false, why:'This undercounts — there are more than 3 distinct numbers that are either even or prime.'},
      {t:'5', correct:true, why:'Evens = $\\{2,4,6\\}$, primes = $\\{2,3,5\\}$. Their union is $\\{2,3,4,5,6\\}$ — 5 distinct numbers (note 2 is counted only once, even though it\'s in both categories).'},
      {t:'4', correct:false, why:'This undercounts by one — double check the full union $\\{2,3,4,5,6\\}$, which has 5 elements.'},
      {t:'6', correct:false, why:'This is the total size of $S$ itself, but not every number in $S$ is even or prime (1 is neither).'}
    ]
  }),
  buildVariant: (rng)=>{
    const n = randInt(rng,7,12);
    const S = Array.from({length:n},(_,i)=>i+1);
    function isPrime(x){ if(x<2) return false; for(let i=2;i*i<=x;i++) if(x%i===0) return false; return true; }
    const evens = S.filter(x=>x%2===0);
    const primes = S.filter(isPrime);
    const union = Array.from(new Set([...evens,...primes])).sort((a,b)=>a-b);
    const correct = union.length;
    const naiveSum = evens.length+primes.length;
    const opts = [
      {t:String(correct-1), correct:false, why:`This undercounts the true union $\\{${union.join(',')}\\}$, which has ${correct} elements.`},
      {t:String(correct), correct:true, why:`Evens = $\\{${evens.join(',')}\\}$, primes = $\\{${primes.join(',')}\\}$. Their union is $\\{${union.join(',')}\\}$ — ${correct} distinct numbers (shared elements like 2 are counted only once).`},
      {t:String(naiveSum), correct:false, why:`This naively adds $|evens|+|primes|=${naiveSum}$ without removing the double-counted overlap (numbers that are both even and prime).`},
      {t:String(n), correct:false, why:`This is the size of the whole set $S$, but not every number in $S$ is even or prime.`}
    ];
    return {text:`Suppose you are choosing a number from the set $S=\\{1,\\dots,${n}\\}$. You may either choose an even number, or choose a prime number. How many choices do you have?`, options:opts};
  }
});

Q({
  id:'W08-Q10', week:8, concept:'Counting all functions between two finite sets ($|B|^{|A|}$)',
  objective:'Compute the total number of possible functions mapping a finite set A to a finite set B, using $|B|^{|A|}$.',
  hints:['Each of the elements in A independently needs to be assigned SOME element of B.','For EACH element of A, there are $|B|$ possible choices of output.','Multiply the number of choices together for every element of A: that\'s $|B|^{|A|}$, not $|A|^{|B|}$.'],
  tip:'The number of functions from a set of size $m$ to a set of size $n$ is $n^m$ — think of it as $m$ independent choices, each with $n$ options.',
  buildOriginal: ()=>({
    text:'How many functions are there mapping a 3-element set A to a 2-element set B?',
    options:[
      {t:'6', correct:false, why:'This looks like $3\\times2$ — but functions counting uses exponentiation ($|B|^{|A|}$), not simple multiplication.'},
      {t:'5', correct:false, why:'Doesn\'t correspond to any meaningful calculation here.'},
      {t:'8', correct:true, why:'Each of the 3 elements of A independently has 2 possible images in B, giving $2^3=8$ total functions.'},
      {t:'9', correct:false, why:'This would be $3^2$ (swapping the roles of A and B) — but the correct formula is $|B|^{|A|}=2^3$, not $|A|^{|B|}$.'}
    ]
  }),
  buildVariant: (rng)=>{
    const sizeA = randInt(rng,2,4);
    const sizeB = randInt(rng,2,4);
    const correct = Math.pow(sizeB,sizeA);
    const swapAnswer = Math.pow(sizeA,sizeB);
    const opts = [
      {t:String(sizeA*sizeB), correct:false, why:'This multiplies the two sizes together, but counting functions requires exponentiation, not simple multiplication.'},
      {t:String(correct), correct:true, why:`Each of the ${sizeA} elements of A independently has ${sizeB} possible images in B, giving $${sizeB}^{${sizeA}}=${correct}$ total functions.`},
      {t:String(swapAnswer===correct? correct+1 : swapAnswer), correct:false, why:`This swaps the roles of A and B in the exponent — the correct formula is $|B|^{|A|}$, not $|A|^{|B|}$.`},
      {t:String(sizeA+sizeB), correct:false, why:'This adds the sizes, which isn\'t the right operation for counting functions.'}
    ];
    const s = shuffleWithAnswer(rng, opts, 1);
    return {text:`How many functions are there mapping a ${sizeA}-element set A to a ${sizeB}-element set B?`, options:s.options};
  }
});
</script>
<script>
/* =========================================================
   UI RENDERING
   ========================================================= */
let VIEW = {mode:'dashboard', week:null, queue:[], qIndex:0, currentSession:null};
let CUR = null; // current rendered question instance: {qDef, built, chosen:[], submitted:false, hintLevel:0, isVariant:bool, seed}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = headerHTML() + navHTML();
  const body = document.createElement('div');
  body.id='body';
  app.appendChild(body);

    case 'dashboard': body.innerHTML = dashboardHTML(); attachDashboardEvents(); break;

    case 'mistakes': body.innerHTML = mistakesHTML(); attachMistakesEvents(); break;
